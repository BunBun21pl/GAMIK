<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kreator prac pisemnych — GAMIK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  window.MathJax = {
    tex:{ inlineMath:[['$','$'],['\\(','\\)']], displayMath:[['$$','$$'],['\\[','\\]']] },
    svg:{ fontCache:'global' }, startup:{ typeset:false }
  };
</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>
<style>
  :root{
    --bg:#e8eaed; --paper:#fff; --ink:#15181d; --muted:#697079; --muted-2:#9aa0a8;
    --line:#d5d9df; --line-2:#c3c9d1; --accent:#2f5a8f; --accent-d:#244870; --soft:#eef2f8;
    --radius:12px; --radius-sm:8px; --sans:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:var(--sans); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; font-size:14.5px; line-height:1.5}
  button{font-family:inherit; cursor:pointer} input,select,textarea{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

  /* chrome */
  .chrome-top{position:sticky; top:0; z-index:30; background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; padding:11px 20px; flex-wrap:wrap}
  .mark{display:flex; align-items:center; gap:10px; font-weight:600}
  .mark .t b{font-weight:700} .mark .t span{color:var(--muted); font-weight:500}
  .grow{flex:1}
  .toolbtns{display:flex; gap:8px; flex-wrap:wrap}
  .btn{border:1px solid var(--accent); background:var(--accent); color:#fff; padding:8px 14px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:600}
  .btn:hover{opacity:.9}
  .btn.ghost{background:#fff; color:var(--ink); border-color:var(--line-2)} .btn.ghost:hover{background:#f6f7f9}
  .btn.sm{padding:5px 10px; font-size:12.5px}
  .btn.icon{padding:5px 9px; background:#fff; color:var(--ink); border-color:var(--line-2)} .btn.icon:hover{background:#f2f4f7}
  .btn.danger{background:#fff; color:#b3261e; border-color:#e6c3c1} .btn.danger:hover{background:#fbf0ef}

  .wrap{max-width:900px; margin:0 auto; padding:22px 18px 90px}
  .block{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px}
  .block > h2{font-size:12px; color:var(--muted); margin:0 0 14px; font-weight:700}
  .fields{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
  .fields .full{grid-column:1/-1}
  @media(max-width:620px){ .fields{grid-template-columns:1fr} }
  label.f{display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--muted)}
  label.f input, label.f select, label.f textarea{font-size:14px; color:var(--ink); background:#fff; border:1px solid var(--line-2); border-radius:var(--radius-sm); padding:9px 11px; font-weight:400}
  label.f textarea{resize:vertical; min-height:64px; line-height:1.5}
  label.f input:focus, label.f select:focus, label.f textarea:focus{border-color:var(--accent); outline:1px solid var(--accent)}

  .seg{display:inline-flex; gap:3px; background:var(--bg); padding:4px; border-radius:999px; margin-bottom:16px}
  .seg button{border:0; background:transparent; padding:8px 18px; border-radius:999px; font-weight:600; font-size:13.5px; color:var(--muted)}
  .seg button.active{background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}

  .palette{display:flex; flex-wrap:wrap; gap:8px}
  .palette button{border:1px solid var(--line-2); background:#fff; color:var(--ink); border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:8px}
  .palette button:hover{border-color:var(--accent); color:var(--accent); background:var(--soft)}
  .palette .ic{display:inline-grid; place-items:center; min-width:20px; height:18px; border-radius:5px; background:var(--soft); color:var(--accent); font-size:11px; font-weight:700; padding:0 4px}

  .mathbar{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .mathbar .lab{font-size:12px; color:var(--muted); font-weight:600; margin-right:2px}
  .mathbar button{border:1px solid var(--line-2); background:#fff; border-radius:6px; padding:4px 9px; font-size:14px}
  .mathbar button:hover{background:var(--soft); border-color:var(--accent)}

  .task-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:14px; overflow:hidden}
  .tc-head{display:flex; align-items:center; gap:10px; padding:11px 14px; background:#f7f8fa; border-bottom:1px solid var(--line)}
  .tc-num{font-weight:700; font-size:14px}
  .tc-type{font-size:12px; color:var(--muted); font-weight:600; padding:2px 9px; border:1px solid var(--line-2); border-radius:999px; background:#fff; display:inline-flex; gap:6px; align-items:center}
  .tc-type .ic{font-weight:700; color:var(--accent)}
  .tc-pts{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); font-weight:600}
  .tc-pts input{width:56px; text-align:center; border:1px solid var(--line-2); border-radius:6px; padding:5px; font-size:14px; font-weight:600}
  .tc-body{padding:14px}
  .opt-row{display:flex; align-items:center; gap:8px; margin-bottom:7px}
  .opt-row .let{width:22px; height:22px; border-radius:5px; background:var(--soft); color:var(--accent); display:grid; place-items:center; font-weight:700; font-size:12px; flex:0 0 auto}
  .opt-row input[type=text]{flex:1; border:1px solid var(--line-2); border-radius:6px; padding:7px 9px; font-size:14px}
  .opt-row .key{display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--muted); white-space:nowrap}
  .mini{border:1px solid var(--line-2); background:#fff; border-radius:6px; padding:4px 9px; font-size:12.5px; font-weight:600; color:var(--muted)}
  .mini:hover{color:var(--accent); border-color:var(--accent)}
  .hintline{font-size:12px; color:var(--muted-2); margin-top:6px}
  .imgprev{max-width:220px; max-height:150px; border:1px solid var(--line); border-radius:8px; margin-top:8px; display:block}
  .empty{text-align:center; color:var(--muted-2); padding:34px; border:1px dashed var(--line-2); border-radius:var(--radius); background:#fff}
  .bank-bar{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:10px}
  .bank-bar label.f{flex:1; min-width:190px}
  .bank-row{display:flex; gap:12px; align-items:flex-start; padding:12px 2px; border-top:1px solid var(--line)}
  .bank-row .ic{display:inline-grid; place-items:center; min-width:34px; height:20px; border-radius:5px; background:var(--soft); color:var(--accent); font-size:10.5px; font-weight:700; padding:0 4px; flex:0 0 auto; margin-top:2px}
  .bank-q{flex:1; min-width:0; font-size:13.5px}
  .bank-q .det{font-size:12.5px; color:var(--muted); margin-top:3px; white-space:pre-wrap}
  .bank-q .ans{font-size:12.5px; color:#1c7a43; margin-top:3px}
  .bank-meta{font-size:12px; color:var(--muted); white-space:nowrap; font-weight:600; margin-top:3px}
  .btn:disabled{opacity:.6; cursor:default}
  .block-sub{margin-top:12px; padding:12px; border:1px dashed var(--line-2); border-radius:10px; background:#fbfcfd}
  .mat{border:1px solid var(--line); border-radius:8px; padding:10px; margin:8px 0; background:#fff}
  .mat-h{display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:6px}
  .sub-card{border:1px solid var(--line); border-radius:9px; margin:8px 0; background:#fff; overflow:hidden}
  .sub-chead{display:flex; align-items:center; gap:8px; padding:8px 10px; background:#f3f5f7; border-bottom:1px solid var(--line)}
  .sub-n{width:22px; height:22px; border-radius:6px; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:700; font-size:12px; flex:0 0 auto}
  .sub-type{border:1px solid var(--line-2); border-radius:6px; padding:5px 8px; font-size:13px; font-weight:600; background:#fff}
  .sub-body{padding:10px}
  .sub-palette{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}

  /* ============ ARKUSZ ============ */
  .stage{display:none}
  body.previewing .editor{display:none}
  body.previewing .stage{display:block}

  .sheet{background:#fff; color:#111; font-family:var(--sans); width:210mm; max-width:100%;
    margin:0 auto 40px; padding:16mm 15mm; box-shadow:0 3px 40px rgba(20,24,31,.14); border:1px solid #e3e3e3; line-height:1.5; font-size:11.6pt}
  .sheet.mode-test{ --ac:#35707a; --ac-d:#2a5960; --ac-soft:#e7f0f1 }
  .sheet.mode-exam{ --ac:#6a4a9c; --ac-d:#523a7d; --ac-soft:#ece3f5 }
  .sheet.mode-exam.exam-blue{ --ac:#3d74d6; --ac-d:#2a55a8; --ac-soft:#e4ecfb }

  /* --- TEST --- */
  .test-head{background:var(--ac); color:#fff; padding:18px 22px; border-radius:5px}
  .test-head .eyebrow{font-size:10pt; letter-spacing:.12em; text-transform:uppercase; font-weight:600; opacity:.9}
  .test-head h1{font-size:20pt; margin:7px 0 0; font-weight:800; line-height:1.15}
  .test-head .sub{font-size:11pt; margin-top:5px; opacity:.92; font-weight:400}
  .test-identity{display:flex; flex-wrap:wrap; gap:7px 26px; margin:16px 2px 6px; font-size:11pt; align-items:baseline}
  .test-identity .fld{display:flex; gap:8px; align-items:baseline}
  .test-identity .fld .lb{font-weight:600; white-space:nowrap}
  .test-identity .fld .ln{border-bottom:1px solid #111; min-width:70px; display:inline-block; height:14px}

  /* --- EXAM (matura style) --- */
  .exam-top{display:flex; justify-content:space-between; gap:16px; font-size:8pt; color:#6d6d6d}
  .exam-top .brand{display:flex; align-items:center; gap:8px; color:var(--ac-d); font-weight:800; letter-spacing:.04em; font-size:9pt}
  .exam-fill{border:1px solid var(--ac); border-radius:3px; margin-top:8px; overflow:hidden}
  .exam-fill .bar{background:var(--ac-soft); color:var(--ac-d); font-weight:700; font-size:8.5pt; letter-spacing:.1em; padding:4px 12px; text-transform:uppercase}
  .codes{display:flex; gap:26px; padding:9px 12px; align-items:center; flex-wrap:wrap}
  .codes .grp{display:flex; align-items:center; gap:8px; font-size:9pt; font-weight:700}
  .cells{display:flex; gap:3px}
  .cell{width:15px; height:20px; border:1px solid #555; border-radius:2px}
  .exam-band{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap}
  .exam-band .wt{background:var(--ac-soft); color:var(--ac-d); font-weight:800; font-size:13pt; padding:7px 16px; border-radius:3px}
  .exam-band .fm{color:var(--ac-d); font-weight:800; font-size:12pt; font-style:italic}
  .exam-title{background:var(--ac); color:#fff; border-radius:4px; padding:16px 20px; margin-top:12px}
  .exam-title .subj{font-size:27pt; font-weight:800; letter-spacing:.01em; line-height:1.05}
  .exam-title .lvl{display:inline-block; margin-top:10px; background:rgba(255,255,255,.2); padding:4px 14px; border-radius:3px; font-size:13pt; font-weight:700}
  .exam-topic{font-size:12pt; margin-top:12px; font-weight:600}
  .exam-topic .lab{color:#555; font-weight:400; font-style:italic; margin-right:6px}
  .exam-meta{margin-top:14px; font-size:11.5pt; line-height:1.95}
  .exam-meta b{font-size:12.5pt}

  .instruction{font-size:10.5pt; color:#1a1a1a; padding:10px 0 2px; margin-top:12px}
  .instruction .ih{font-weight:700; margin-bottom:4px}
  .sheet-rule{border:0; border-top:2px solid var(--ac); margin:14px 0}

  .task{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid #e3e3e3; align-items:flex-start}
  .task:last-of-type{border-bottom:0}
  .t-no{width:26px; height:26px; border-radius:7px; background:var(--ac); color:#fff; display:grid; place-items:center; font-weight:700; font-size:12pt; flex:0 0 auto}
  .t-main{flex:1; min-width:0}
  .t-head{display:flex; align-items:baseline; gap:9px; margin-bottom:2px}
  .t-head .t-title{font-weight:700; font-size:12.5pt}
  .t-head .zno{font-weight:700; font-size:12pt}
  .t-ic{display:inline-grid; place-items:center; min-width:20px; height:17px; padding:0 5px; border:1px solid #cfcfcf; border-radius:5px; font-size:8.5pt; color:#6b6b6b; background:#f6f6f6; font-weight:700}
  .t-pts{margin-left:auto; white-space:nowrap; color:#555; font-size:10.5pt; font-weight:600}
  .t-pts .blank{display:inline-block; border-bottom:1px solid #888; width:24px; height:12px; vertical-align:baseline}
  .t-content{white-space:normal; margin:3px 0}
  .t-content.italic{font-style:italic; color:#333}
  .task-src{border:1px solid #111; padding:10px 12px; margin:8px 0; font-size:10.5pt; background:#fbfbfb}
  .task-src .src-cap{font-size:9pt; font-style:italic; color:#333; margin-top:6px; text-align:right}
  .task-img{max-width:100%; max-height:80mm; display:block; margin:8px auto; border:1px solid #111}
  .opt{margin:5px 0 0 2px}
  .opt .lt{font-weight:700; margin-right:7px}
  .opt.correct{background:#eef7f0}
  .tf-row{display:flex; align-items:center; gap:14px; margin:5px 0}
  .tf-row .st{flex:1}
  .tf-row .pf{font-weight:700; letter-spacing:.1em; white-space:nowrap}
  .tf-row .pf .on{color:#1c7a43; text-decoration:underline}
  .match-wrap{display:flex; gap:22px; margin-top:6px}
  .match-wrap .col{flex:1} .match-wrap ol{margin:4px 0; padding-left:22px} .match-wrap ul{margin:4px 0; padding-left:0; list-style:none}
  .match-key{font-size:10pt; margin-top:6px; color:#1c7a43}
  .writelines{margin-top:8px}
  .wl{border-bottom:1px dotted #555; height:26px}
  .workbox{margin-top:8px; border:1px solid #111}
  .workbox.grid{background-image:linear-gradient(#e3e3e3 1px,transparent 1px),linear-gradient(90deg,#e3e3e3 1px,transparent 1px); background-size:5mm 5mm}
  .scratch{margin-top:10px}
  .scratch .sl{font-size:9pt; font-weight:700; letter-spacing:.08em; color:#666; text-transform:uppercase; margin-bottom:4px}
  .subtask{margin-top:12px; padding-left:14px; border-left:2px solid var(--ac-soft)}
  .sub-head{display:flex; align-items:baseline; gap:9px; margin-bottom:2px}
  .sub-no{font-weight:700; font-size:11.5pt}
  .rz-lab{font-weight:600; margin-top:6px}
  .task-fig{margin:8px 0}
  .task-fig figcaption{margin-top:4px}
  .src-no{font-weight:700; font-size:9.5pt; color:#444; margin-bottom:4px}
  .csym{height:14px; width:auto; vertical-align:middle; margin:0 6px}
  .exam-instr{break-before:page; break-after:page; padding-top:4mm}
  .exam-instr .em-mark{display:flex; justify-content:flex-end; margin-bottom:6mm; color:var(--ac)}
  .ei-h{font-size:16pt; font-weight:800; margin:0 0 12px}
  .ei-list{padding-left:20px; font-size:10.8pt; line-height:1.55}
  .ei-list li{margin-bottom:9px; padding-left:4px}
  .answer-card{break-before:page; font-size:10pt}
  .ac-top{display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #000; padding-bottom:6px; gap:12px}
  .ac-title{font-weight:800; letter-spacing:.03em; font-size:11pt}
  .ac-code{font-weight:700; font-family:'Inter',monospace; font-size:10pt; text-align:right}
  .ac-chk{font-size:9pt; margin-top:8px; line-height:1.9; color:#222}
  .chkbox{display:inline-block; width:12px; height:12px; border:1.5px solid #c0392b; border-radius:2px; vertical-align:-2px; margin-right:6px}
  .ac-band{background:#000; color:#fff; font-weight:700; text-align:center; padding:4px; letter-spacing:.1em; margin:14px 0 8px; font-size:9.5pt}
  .ac-pesel{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap}
  .ac-pesel .lb{font-weight:700; letter-spacing:.06em}
  .ac-naklejka{margin-left:auto; border:1px dashed #c0392b; color:#c0392b; font-style:italic; font-size:8pt; padding:8px 12px; border-radius:3px; max-width:46%; text-align:center}
  .ac-sub{font-weight:700; font-size:9pt; letter-spacing:.04em; margin:10px 0 6px; text-transform:uppercase; color:#333}
  .acard-grid{display:flex; flex-wrap:wrap; gap:4px 20px}
  .acard-row{display:flex; align-items:center; gap:7px; margin-bottom:3px; min-width:150px}
  .acard-row.egz .anum{color:#000}
  .anum{font-weight:700; min-width:34px; font-size:9pt}
  .aboxes{display:flex; gap:3px; flex-wrap:wrap}
  .abox{display:inline-grid; place-items:center; width:17px; height:16px; border:1px solid #c0392b; border-radius:2px; font-size:7.5pt; color:#c0392b; font-weight:700}
  .pbox{display:inline-grid; place-items:center; min-width:16px; height:16px; padding:0 2px; border:1px solid #c0392b; border-radius:2px; font-size:7.5pt; color:#c0392b; font-weight:700}
  .essay-tab{border-collapse:collapse; margin:12px 0}
  .essay-tab caption{font-weight:800; text-align:left; margin-bottom:5px; font-size:10pt}
  .essay-tab th{border:1px solid #000; padding:3px 8px; font-size:9pt; text-align:left; font-weight:700; background:#f3f3f3}
  .essay-tab td.pbox{border:1px solid #000; color:#000; border-radius:0; width:20px; height:18px}
  .essay-tab td.pbox.empty{border:1px solid #e2e2e2}
  .t-pts-exam{margin-top:2px}

  .brudnopis{margin-top:16px; border-top:2px solid var(--ac); padding-top:8px}
  .brudnopis .bl{font-weight:700; letter-spacing:.14em; font-size:10pt; color:var(--ac-d)}
  .sheet-foot{margin-top:18px; text-align:center; font-size:8pt; color:#9a9a9a; letter-spacing:.03em}

  .preview-note{max-width:210mm; margin:0 auto 14px; font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .switchkey{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink); font-weight:600}

  @media(max-width:840px){ .sheet{padding:10mm 8mm} }

  @media print{
    .chrome-top,.editor,.preview-note,.noprint{display:none !important}
    body{background:#fff}
    body .stage{display:block}
    .sheet{box-shadow:none; border:0; margin:0; width:auto; max-width:none; padding:0}
    @page{size:A4; margin:12mm}
    .task,.workbox,.task-src,.exam-title,.exam-fill,.test-head{break-inside:avoid}
    .t-head{break-after:avoid}
    .fullpage{break-before:page}
  }
</style>
</head>
<body>
<div class="chrome-top">
  <div class="mark">
    <svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,22 90,42 50,62 10,42" fill="#2f5a8f"/>
      <path d="M32 54 v13 c0 6 8 11 18 11 s18-5 18-11 V54 L50 63 Z" fill="#2f5a8f"/>
    </svg>
    <span class="t"><b>Kreator prac pisemnych</b> <span>· GAMIK</span></span>
  </div>
  <div class="grow"></div>
  <div class="toolbtns">
    <a class="btn ghost" href="index.html" style="text-decoration:none">Dziennik</a>
    <button class="btn ghost" id="btn-edit" style="display:none">← Wróć do edycji</button>
    <button class="btn ghost" id="btn-save">Zapisz plik</button>
    <button class="btn ghost" id="btn-load">Wczytaj</button>
    <button class="btn ghost" id="btn-preview">Podgląd</button>
    <button class="btn" id="btn-print">Drukuj / PDF</button>
  </div>
  <input type="file" id="file-load" accept="application/json" style="display:none">
</div>

<div class="wrap">
  <div class="editor" id="editor">
    <div class="block" id="settings"></div>

    <div class="block">
      <h2>Wstaw wzór matematyczny (do aktywnego pola)</h2>
      <div class="mathbar" id="mathbar"><span class="lab">Symbole:</span></div>
    </div>

    <div class="block">
      <h2>Dodaj zadanie</h2>
      <div class="palette" id="palette"></div>
    </div>

    <div class="block" id="bank"></div>

    <div id="tasks"></div>
  </div>

  <div class="stage" id="stage">
    <div class="preview-note noprint">
      <span>Podgląd arkusza — tak wydrukuje się praca.</span>
      <label class="switchkey"><input type="checkbox" id="chk-key"> Pokaż klucz odpowiedzi</label>
    </div>
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<script>
/* ===== helpers ===== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el = h => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; };
const uid = () => 'z'+Math.random().toString(36).slice(2,9);

const TYPES = {
  closed:     {label:'Zamknięte (wybór)',       icon:'ABC'},
  truefalse:  {label:'Prawda / Fałsz',          icon:'P/F'},
  matching:   {label:'Na dobieranie',           icon:'⇄'},
  gaps:       {label:'Uzupełnianie luk',        icon:'▁▁'},
  open:       {label:'Otwarte',                 icon:'✎'},
  source:     {label:'Ze źródłem',              icon:'❝'},
  image:      {label:'Z obrazem / mapą',        icon:'▦'},
  essay:      {label:'Wypracowanie',            icon:'¶'},
  math_closed:{label:'Matematyczne — zamknięte',icon:'∑·ABC'},
  math_open:  {label:'Matematyczne — otwarte',  icon:'∑·▦'},
  rozstrzygniecie:{label:'Rozstrzygnięcie + uzasadnienie', icon:'R/U'},
  divided:    {label:'Zadanie podzielone (5.1, 5.2…)', icon:'⊞'},
};
const WORKTYPES = {
  test: ['Kartkówka','Sprawdzian'],
  exam: ['Egzamin roczny','Egzamin roczny diagnostyczny','Egzamin maturalny diagnostyczny'],
};
/* Egzaminy roczne drukują się na niebiesko, maturalny – na fioletowo. */
const isAnnualExam = m => m.mode==='exam' && /roczny/i.test(m.workType||'');
const DEF_INSTR = 'Przeczytaj uważnie polecenia. Pisz czytelnie. W zadaniach zamkniętych zaznacz poprawną odpowiedź. Nie używaj korektora.';
const DEF_EXAM_INSTR = 'Sprawdź, czy arkusz egzaminacyjny zawiera wszystkie kolejno ponumerowane strony. Ewentualny brak zgłoś przewodniczącemu zespołu nadzorującego egzamin.\nNa pierwszej stronie arkusza oraz na karcie odpowiedzi wpisz swój numer PESEL i przyklej naklejkę z kodem.\nSymbol [SYMBOL] zamieszczony przy zadaniu zamkniętym oznacza, że rozwiązanie tego zadania musisz przenieść na kartę odpowiedzi. Ocenie podlegają wyłącznie odpowiedzi zaznaczone na karcie odpowiedzi.\nOdpowiedzi do zadań zamkniętych oznaczonych symbolem [SYMBOL] zaznacz na karcie odpowiedzi w części przeznaczonej dla zdającego: zamaluj pola do tego przeznaczone; błędne zaznaczenie otocz kółkiem i zaznacz właściwe.\nOdpowiedzi do pozostałych zadań zapisz w miejscu na to przeznaczonym przy każdym zadaniu.\nPisz czytelnie. Używaj długopisu/pióra tylko z czarnym tuszem/atramentem.\nNie używaj korektora, a błędne zapisy wyraźnie przekreśl.\nNie wpisuj żadnych znaków w tabelkach przeznaczonych dla egzaminatora. Tabelki są umieszczone na marginesie przy wybranych zadaniach.\nPamiętaj, że zapisy w brudnopisie nie będą oceniane.';
const isClosedType = t => ['closed','math_closed','truefalse','matching'].includes(t);
const CLOSED_SYMBOL = '<svg class="csym" viewBox="0 0 92 30" aria-hidden="true"><g fill="none" stroke="#c0392b" stroke-width="3"><rect x="2" y="7" width="16" height="16"/><rect x="20" y="7" width="16" height="16"/><rect x="38" y="7" width="16" height="16"/><rect x="56" y="7" width="16" height="16"/></g><path d="M58 25 L88 3" stroke="#2f5aa8" stroke-width="5" stroke-linecap="round"/><path d="M58 25 l8 1 -2 -7 z" fill="#2f5aa8"/></svg>';

let state = { meta:{}, tasks:[] };
let activeField = null;

function newTask(type){
  const b = { id:uid(), type, title:'', content:'', points:2 };
  if(type==='closed')      return {...b, options:['','',''], correct:null};
  if(type==='truefalse')   return {...b, statements:[{text:'',ans:null},{text:'',ans:null}]};
  if(type==='matching')    return {...b, left:[{text:'',correct:''}], right:['','']};
  if(type==='gaps')        return {...b, lines:2};
  if(type==='open')        return {...b, lines:4};
  if(type==='source')      return {...b, sources:[{label:'Źródło',text:''}], images:[], lines:5};
  if(type==='image')       return {...b, sources:[], images:[{data:null,caption:''}], lines:5};
  if(type==='rozstrzygniecie') return {...b, sources:[], images:[], answer:'', lines:4};
  if(type==='divided')     return {...b, sources:[], images:[], subtasks:[]};
  if(type==='essay')       return {...b, points:15, lines:18, criteria:[{name:'Treść',max:5},{name:'Kompozycja',max:3},{name:'Język',max:4}]};
  if(type==='math_closed') return {...b, points:1, options:['','','',''], correct:null, scratchmm:45};
  if(type==='math_open')   return {...b, points:6, heightmm:200, fullpage:true};
  return b;
}
function newSub(type){
  const s={ id:uid(), type, content:'', points:1 };
  if(type==='closed'||type==='math_closed'){ s.options=['','','','']; s.correct=null; if(type==='math_closed') s.scratchmm=40; }
  if(type==='truefalse') s.statements=[{text:'',ans:null},{text:'',ans:null}];
  if(type==='matching'){ s.left=[{text:'',correct:''}]; s.right=['','']; }
  if(type==='rozstrzygniecie'){ s.answer=''; s.lines=3; }
  if(type==='gaps'||type==='open') s.lines=3;
  return s;
}

function initMeta(){
  state.meta = { mode:'test', subject:'Historia', workType:'Sprawdzian', level:'',
    formula:'Formuła 2023', topic:'', subtitle:'', klasa:'', duration:'45', date:'',
    instruction:DEF_INSTR, examInstruction:DEF_EXAM_INSTR, answerCard:true, brudnopis:false };
}

/* ===== settings (zależne od trybu) ===== */
const settings = document.getElementById('settings');
function bindVal(id,key){ const e=document.getElementById(id); if(e) e.addEventListener('input', ev=> state.meta[key]=ev.target.value); }
function renderSettings(){
  const m=state.meta;
  const wt=WORKTYPES[m.mode]; if(!wt.includes(m.workType)) m.workType=wt[0];
  const wtOpts=wt.map(x=>`<option ${m.workType===x?'selected':''}>${esc(x)}</option>`).join('');
  const subjOpts=['Historia','Wiedza o społeczeństwie','Matematyka'].map(x=>`<option ${m.subject===x?'selected':''}>${esc(x)}</option>`).join('');
  let modeFields='';
  if(m.mode==='exam'){
    const lv=['','Poziom podstawowy','Poziom rozszerzony'];
    modeFields=`
      <label class="f">Poziom<select id="s-level">${lv.map(x=>`<option value="${esc(x)}" ${m.level===x?'selected':''}>${x?esc(x):'— brak —'}</option>`).join('')}</select></label>
      <label class="f">Formuła / oznaczenie<input id="s-formula" value="${esc(m.formula)}" placeholder="np. Formuła 2023"></label>
      <label class="f full">Instrukcja dla zdającego (osobna strona)<textarea id="s-einstruction" style="min-height:120px">${esc(m.examInstruction)}</textarea></label>
      <label class="f full" style="flex-direction:row; align-items:center; gap:8px"><input type="checkbox" id="s-answercard" ${m.answerCard?'checked':''}> Dodaj kartę odpowiedzi na końcu</label>`;
  } else {
    modeFields=`
      <label class="f">Klasa<input id="s-klasa" value="${esc(m.klasa)}" placeholder="np. 8a"></label>
      <label class="f">Podtytuł (opis)<input id="s-subtitle" value="${esc(m.subtitle)}" placeholder="np. zakres materiału / działy"></label>
      <label class="f full">Instrukcja dla ucznia<textarea id="s-instruction">${esc(m.instruction)}</textarea></label>`;
  }
  settings.innerHTML=`
    <h2>Ustawienia arkusza</h2>
    <div class="seg" id="mode-seg">
      <button data-m="test" class="${m.mode==='test'?'active':''}">Test (karta pracy)</button>
      <button data-m="exam" class="${m.mode==='exam'?'active':''}">Egzamin (styl maturalny)</button>
    </div>
    <div class="fields">
      <label class="f">Przedmiot<select id="s-subject">${subjOpts}</select></label>
      <label class="f">Rodzaj pracy<select id="s-worktype">${wtOpts}</select></label>
      <label class="f full">Temat<input id="s-topic" value="${esc(m.topic)}" placeholder="np. II wojna światowa"></label>
      ${modeFields}
      <label class="f">Czas (min)<input id="s-duration" value="${esc(m.duration)}" placeholder="45"></label>
      <label class="f">Data<input id="s-date" value="${esc(m.date)}" placeholder="np. 6 maja 2025 r."></label>
      <label class="f full" style="flex-direction:row; align-items:center; gap:8px"><input type="checkbox" id="s-brudnopis" ${m.brudnopis?'checked':''}> Dodaj brudnopis na końcu</label>
    </div>`;
  settings.querySelector('#mode-seg').querySelectorAll('button').forEach(b=> b.onclick=()=>{ state.meta.mode=b.dataset.m; renderSettings(); });
  bindVal('s-subject','subject'); bindVal('s-worktype','workType'); bindVal('s-topic','topic');
  bindVal('s-duration','duration'); bindVal('s-date','date'); bindVal('s-instruction','instruction');
  if(m.mode==='exam'){ bindVal('s-level','level'); bindVal('s-formula','formula'); bindVal('s-einstruction','examInstruction'); const ac=document.getElementById('s-answercard'); if(ac) ac.onchange=e=> state.meta.answerCard=e.target.checked; }
  else { bindVal('s-klasa','klasa'); bindVal('s-subtitle','subtitle'); bindVal('s-instruction','instruction'); }
  settings.querySelector('#s-brudnopis').onchange=e=> state.meta.brudnopis=e.target.checked;
}

/* ===== palette ===== */
const palette=document.getElementById('palette');
Object.entries(TYPES).forEach(([type,info])=>{
  const b=el(`<button><span class="ic">${esc(info.icon)}</span>${esc(info.label)}</button>`);
  b.onclick=()=>{ state.tasks.push(newTask(type)); renderTasks(); const c=document.querySelector('.task-card:last-child'); c&&c.scrollIntoView({behavior:'smooth',block:'center'}); };
  palette.appendChild(b);
});

/* ===== math toolbar ===== */
const MATH=[['x²','^{}'],['x₁','_{}'],['√','\\sqrt{}'],['ⁿ√','\\sqrt[n]{}'],['a/b','\\frac{}{}'],['·','\\cdot '],['×','\\times '],['÷','\\div '],['±','\\pm '],['≤','\\leq '],['≥','\\geq '],['≠','\\neq '],['π','\\pi '],['°','^{\\circ}'],['∠','\\angle '],['Δ','\\Delta '],['∑','\\sum_{}^{}'],['∫','\\int_{}^{}'],['→','\\to '],['∞','\\infty ']];
const mathbar=document.getElementById('mathbar');
MATH.forEach(([lab,sn])=>{ const b=el(`<button type="button" title="${esc(sn)}">${esc(lab)}</button>`); b.onmousedown=e=>e.preventDefault(); b.onclick=()=>insertMath(sn); mathbar.appendChild(b); });
const hb=el(`<button type="button" style="font-family:var(--sans); font-size:12px">$…$</button>`); hb.onmousedown=e=>e.preventDefault(); hb.onclick=()=>insertMath('$$',true); mathbar.appendChild(hb);
document.addEventListener('focusin', e=>{ if(e.target.matches('textarea, input[type=text]')) activeField=e.target; });
function insertMath(sn, wrap){
  const f=activeField; if(!f){ alert('Kliknij najpierw w pole tekstowe, do którego wstawić wzór.'); return; }
  const s=f.selectionStart??f.value.length, e2=f.selectionEnd??f.value.length;
  let ins, caret;
  if(wrap){ ins='$'+f.value.slice(s,e2)+'$'; caret=s+1; }
  else{
    const before=f.value.slice(0,s); const inside=((before.match(/\$/g)||[]).length)%2===1;
    ins=inside?sn:'$'+sn+'$'; const br=sn.indexOf('{}'); caret=s+(inside?0:1)+(br>=0?br+1:sn.length);
  }
  f.value=f.value.slice(0,s)+ins+f.value.slice(e2); f.dispatchEvent(new Event('input',{bubbles:true})); f.focus(); f.setSelectionRange(caret,caret);
}

/* ===== task editors ===== */
const tasksBox=document.getElementById('tasks');
function renderTasks(){
  tasksBox.innerHTML='';
  if(!state.tasks.length){ tasksBox.appendChild(el(`<div class="empty">Brak zadań. Wybierz typ zadania powyżej, aby zacząć.</div>`)); return; }
  state.tasks.forEach((t,i)=> tasksBox.appendChild(taskCard(t,i)));
}
function fieldInput(task,key,opts,area){
  const tag=area?`<textarea>${esc(task[key]||'')}</textarea>`:`<input type="text" value="${esc(task[key]||'')}">`;
  const w=el(`<label class="f full">${esc(opts.label)}${tag}</label>`);
  const inp=w.querySelector(area?'textarea':'input'); if(opts.placeholder) inp.placeholder=opts.placeholder;
  inp.oninput=()=> task[key]=inp.value; return w;
}
function linesField(task,key,label){
  const w=el(`<label class="f" style="max-width:260px"><span>${esc(label)}</span><input type="number" min="0" step="1" value="${task[key]||0}"></label>`);
  w.querySelector('input').oninput=e=> task[key]=parseInt(e.target.value)||0; return w;
}
function optionsEditor(task){
  const wrap=el(`<div><div class="hintline">Odpowiedzi (zaznacz poprawną w kluczu, jeśli chcesz):</div></div>`);
  task.options.forEach((opt,oi)=>{
    const L=String.fromCharCode(65+oi);
    const row=el(`<div class="opt-row"><span class="let">${L}</span>
      <input type="text" value="${esc(opt)}" placeholder="Odpowiedź ${L} (wzory: $x^2$)">
      <label class="key"><input type="radio" name="key-${task.id}" ${task.correct===oi?'checked':''}> poprawna</label>
      <button class="mini">✕</button></div>`);
    row.querySelector('input[type=text]').oninput=e=> task.options[oi]=e.target.value;
    row.querySelector('input[type=radio]').onchange=()=> task.correct=oi;
    row.querySelector('.mini').onclick=()=>{ task.options.splice(oi,1); if(task.correct===oi) task.correct=null; renderTasks(); };
    wrap.appendChild(row);
  });
  const add=el(`<button class="mini" style="margin-top:4px">+ dodaj odpowiedź</button>`);
  add.onclick=()=>{ task.options.push(''); renderTasks(); }; wrap.appendChild(add); return wrap;
}
function tfEditor(task){
  const wrap=el(`<div><div class="hintline">Zdania do oceny (P/F):</div></div>`);
  task.statements.forEach((st,si)=>{
    const row=el(`<div class="opt-row"><span class="let">${si+1}</span>
      <input type="text" value="${esc(st.text)}" placeholder="Treść zdania ${si+1}">
      <label class="key"><input type="radio" name="tf-${task.id}-${si}" ${st.ans==='P'?'checked':''}> P</label>
      <label class="key"><input type="radio" name="tf-${task.id}-${si}" ${st.ans==='F'?'checked':''}> F</label>
      <button class="mini">✕</button></div>`);
    row.querySelector('input[type=text]').oninput=e=> st.text=e.target.value;
    const rs=row.querySelectorAll('input[type=radio]'); rs[0].onchange=()=>st.ans='P'; rs[1].onchange=()=>st.ans='F';
    row.querySelector('.mini').onclick=()=>{ task.statements.splice(si,1); renderTasks(); };
    wrap.appendChild(row);
  });
  const add=el(`<button class="mini" style="margin-top:4px">+ dodaj zdanie</button>`); add.onclick=()=>{ task.statements.push({text:'',ans:null}); renderTasks(); }; wrap.appendChild(add); return wrap;
}
function matchingEditor(task){
  const wrap=el(`<div><div class="hintline">Kolumna I (z opcjonalnym kluczem):</div></div>`);
  task.left.forEach((Lx,li)=>{
    const row=el(`<div class="opt-row"><span class="let">${li+1}</span>
      <input type="text" value="${esc(Lx.text)}" placeholder="Element ${li+1}">
      <span class="key">→</span><select class="mini" style="padding:6px"></select><button class="mini">✕</button></div>`);
    const sel=row.querySelector('select'); sel.appendChild(el(`<option value="">klucz…</option>`));
    task.right.forEach((R,ri)=>{ const lt=String.fromCharCode(65+ri); const o=el(`<option value="${lt}">${lt}</option>`); if(Lx.correct===lt)o.selected=true; sel.appendChild(o); });
    row.querySelector('input').oninput=e=> Lx.text=e.target.value; sel.onchange=()=> Lx.correct=sel.value;
    row.querySelector('.mini:last-child').onclick=()=>{ task.left.splice(li,1); renderTasks(); };
    wrap.appendChild(row);
  });
  const addL=el(`<button class="mini">+ element (kol. I)</button>`); addL.onclick=()=>{ task.left.push({text:'',correct:''}); renderTasks(); }; wrap.appendChild(addL);
  wrap.appendChild(el(`<div class="hintline" style="margin-top:12px">Kolumna II (możliwości):</div>`));
  task.right.forEach((R,ri)=>{
    const lt=String.fromCharCode(65+ri);
    const row=el(`<div class="opt-row"><span class="let">${lt}</span><input type="text" value="${esc(R)}" placeholder="Możliwość ${lt}"><button class="mini">✕</button></div>`);
    row.querySelector('input').oninput=e=> task.right[ri]=e.target.value;
    row.querySelector('.mini').onclick=()=>{ task.right.splice(ri,1); renderTasks(); };
    wrap.appendChild(row);
  });
  const addR=el(`<button class="mini">+ możliwość (kol. II)</button>`); addR.onclick=()=>{ task.right.push(''); renderTasks(); }; wrap.appendChild(addR); return wrap;
}
function materialsEditor(item){
  item.sources ||= []; item.images ||= [];
  const wrap=el(`<div class="block-sub"><div class="hintline" style="margin-top:0">Materiały źródłowe — możesz dodać kilka źródeł i/lub ilustracji:</div></div>`);
  item.sources.forEach((s,si)=>{
    const box=el(`<div class="mat"><div class="mat-h"><span>Źródło ${si+1}</span><button class="mini">usuń</button></div></div>`);
    box.querySelector('.mini').onclick=()=>{ item.sources.splice(si,1); renderTasks(); };
    box.appendChild(fieldInput(s,'label',{label:'Podpis źródła', placeholder:'np. Konstytucja RP, art. 2'}, false));
    box.appendChild(fieldInput(s,'text',{label:'Treść źródła', placeholder:'Wklej fragment źródła…'}, true));
    wrap.appendChild(box);
  });
  const addS=el(`<button class="mini">+ dodaj źródło</button>`); addS.onclick=()=>{ item.sources.push({label:'Źródło',text:''}); renderTasks(); }; wrap.appendChild(addS);
  item.images.forEach((im,ii)=>{
    const box=el(`<div class="mat"><div class="mat-h"><span>Ilustracja ${ii+1}</span><button class="mini">usuń</button></div></div>`);
    box.querySelector('.mini').onclick=()=>{ item.images.splice(ii,1); renderTasks(); };
    const up=el(`<label class="f full">Plik graficzny<input type="file" accept="image/*"></label>`);
    up.querySelector('input').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ im.data=r.result; renderTasks(); }; r.readAsDataURL(f); };
    box.appendChild(up);
    if(im.data) box.appendChild(el(`<img class="imgprev" src="${im.data}">`));
    box.appendChild(fieldInput(im,'caption',{label:'Podpis ilustracji', placeholder:'np. Mapa Europy 1939 r.'}, false));
    wrap.appendChild(box);
  });
  const addI=el(`<button class="mini" style="margin-left:8px">+ dodaj ilustrację</button>`); addI.onclick=()=>{ item.images.push({data:null,caption:''}); renderTasks(); }; wrap.appendChild(addI);
  return wrap;
}
function criteriaEditor(task){
  task.criteria = task.criteria || [];
  const wrap=el(`<div class="block-sub"><div class="hintline" style="margin-top:0">Kryteria oceny (zakresy) — używane w karcie odpowiedzi w trybie Egzamin:</div></div>`);
  task.criteria.forEach((c,ci)=>{
    const row=el(`<div class="opt-row"><input type="text" value="${esc(c.name)}" placeholder="np. Treść" style="flex:2">
      <span class="key">maks.</span><input type="number" min="0" step="1" value="${c.max}" style="flex:0 0 72px">
      <button class="mini">✕</button></div>`);
    const ins=row.querySelectorAll('input');
    ins[0].oninput=()=> c.name=ins[0].value; ins[1].oninput=()=> c.max=parseInt(ins[1].value)||0;
    row.querySelector('.mini').onclick=()=>{ task.criteria.splice(ci,1); renderTasks(); };
    wrap.appendChild(row);
  });
  const add=el(`<button class="mini">+ dodaj kryterium</button>`); add.onclick=()=>{ task.criteria.push({name:'',max:1}); renderTasks(); }; wrap.appendChild(add);
  return wrap;
}
function typeFieldsEditor(item, body){
  const t=item.type;
  if(t==='closed'||t==='math_closed') body.appendChild(optionsEditor(item));
  if(t==='math_closed') body.appendChild(linesField(item,'scratchmm','Wysokość brudnopisu (mm)'));
  if(t==='truefalse') body.appendChild(tfEditor(item));
  if(t==='matching') body.appendChild(matchingEditor(item));
  if(t==='rozstrzygniecie'){ body.appendChild(fieldInput(item,'answer',{label:'Poprawne rozstrzygnięcie (klucz, opcjonalnie)', placeholder:'np. Tak / Nie'}, false)); body.appendChild(linesField(item,'lines','Liczba linii uzasadnienia')); }
  if(t==='open'||t==='gaps') body.appendChild(linesField(item,'lines','Liczba linii na odpowiedź'));
  if(t==='essay'){ body.appendChild(criteriaEditor(item)); body.appendChild(linesField(item,'lines','Liczba linii na wypracowanie')); }
  if(t==='source'||t==='image') body.appendChild(linesField(item,'lines','Liczba linii na odpowiedź'));
  if(['open','gaps','source','image','essay','math_open'].includes(t)) body.appendChild(fieldInput(item,'keyNote',{label:'Klucz / odpowiedź wzorcowa (widoczna tylko w podglądzie z kluczem)', placeholder:'opcjonalnie'}, true));
  if(t==='math_open'){ body.appendChild(linesField(item,'heightmm','Wysokość kratownicy (mm)')); const g=el(`<label style="display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:var(--muted); margin-top:8px"><input type="checkbox" ${item.fullpage?'checked':''}> zadanie na osobnej stronie</label>`); g.querySelector('input').onchange=e=> item.fullpage=e.target.checked; body.appendChild(g); }
}
const SUBTYPES=[['closed','Zamknięte'],['truefalse','Prawda/Fałsz'],['matching','Na dobieranie'],['gaps','Luki'],['open','Otwarte'],['rozstrzygniecie','Rozstrzygnięcie'],['math_closed','Mat. zamknięte']];
function subEditor(parent, sub, si){
  const card=el(`<div class="sub-card">
    <div class="sub-chead"><span class="sub-n">${si+1}</span>
      <select class="sub-type"></select><span class="grow"></span>
      <span class="tc-pts">pkt <input type="number" min="0" step="1" value="${sub.points}"></span>
      <button class="btn icon" title="W górę">↑</button><button class="btn icon" title="W dół">↓</button><button class="btn danger sm">Usuń</button>
    </div><div class="sub-body"></div></div>`);
  const sel=card.querySelector('.sub-type');
  SUBTYPES.forEach(([k,lab])=>{ const o=el(`<option value="${k}">${esc(lab)}</option>`); if(sub.type===k)o.selected=true; sel.appendChild(o); });

  btns[1].onclick=()=>{ if(si<parent.subtasks.length-1){ [parent.subtasks[si+1],parent.subtasks[si]]=[parent.subtasks[si],parent.subtasks[si+1]]; renderTasks(); } };

  const cl = task.type==='essay' ? 'Temat i wytyczne wypracowania'
           : task.type==='divided' ? 'Wspólne wprowadzenie / polecenie (opcjonalnie)'
           : (task.type==='source'||task.type==='image'||task.type==='rozstrzygniecie') ? 'Polecenie'
           : 'Treść / polecenie';
  body.appendChild(fieldInput(task,'content',{label:cl, placeholder:'Wpisz treść zadania… (wzory: $x^2+1$)'}, true));
  if(['source','image','rozstrzygniecie','divided'].includes(task.type)) body.appendChild(materialsEditor(task));
  if(task.type==='divided'){
    task.subtasks ||= [];
    const sec=el(`<div class="block-sub"><div class="hintline" style="margin-top:0">Podzadania (${task.subtasks.length}):</div></div>`);
    task.subtasks.forEach((s,si)=> sec.appendChild(subEditor(task,s,si)));
    const pal=el(`<div class="sub-palette"></div>`);

    sec.appendChild(pal); body.appendChild(sec);

    typeFieldsEditor(task, body);
  }
  return card;
}

/* ===== ARKUSZ ===== */
function richText(t){ return esc(t).replace(/\n/g,'<br>'); }
function taskPoints(t){
  if(t.type==='divided') return (t.subtasks||[]).reduce((a,s)=>a+(parseInt(s.points)||0),0);
  if(t.type==='essay'){ const c=t.criteria||[]; if(c.length) return c.reduce((a,x)=>a+(parseInt(x.max)||0),0); return parseInt(t.points)||0; }
  return parseInt(t.points)||0;
}
function totalPoints(){ return state.tasks.reduce((s,t)=> s+taskPoints(t),0); }
function cells(n){ let s='<span class="cells">'; for(let i=0;i<n;i++) s+='<span class="cell"></span>'; return s+'</span>'; }
function writeLines(n){ n=Math.max(0,n|0); let s='<div class="writelines">'; for(let i=0;i<n;i++) s+='<div class="wl"></div>'; return s+'</div>'; }
function EM_MARK(m){
  const lab=((m.formula||'').match(/\d{2}/g)||[]).slice(-1)[0]||'';
  return `<svg width="86" height="70" viewBox="0 0 120 100" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4"><polygon points="60,16 104,36 60,56 16,36"/><polygon points="60,30 104,50 60,70 16,50"/><polygon points="60,44 104,64 60,84 16,64"/></g><text x="60" y="58" text-anchor="middle" fill="currentColor" font-family="Inter,sans-serif" font-weight="800" font-size="14" transform="rotate(-18 60 54)">${isAnnualExam(m)?'ER':'EM'} ${lab}</text></svg>`;
}
function instrLines(text){
  return String(text||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=> `<li>${richText(l).split('[SYMBOL]').join(CLOSED_SYMBOL)}</li>`).join('');
}
function ansLetters(n){ n=Math.max(1,n|0); let s=''; for(let i=0;i<n;i++) s+=`<span class="abox">${String.fromCharCode(65+i)}</span>`; return s; }
function ansPF(){ return `<span class="abox">P</span><span class="abox">F</span>`; }
function ptsBoxes(max){ max=Math.max(0,max|0); let s=''; for(let i=0;i<=max;i++) s+=`<span class="pbox">${i}</span>`; return s; }
function collectAnswer(){
  const zd=[], egz=[], essays=[];
  const pushClosed=(prefix,it)=>{
    if(it.type==='closed'||it.type==='math_closed'){ zd.push({num:prefix, boxes:ansLetters((it.options||[]).length||4)}); }
    else if(it.type==='truefalse'){ const st=it.statements||[]; if(st.length<=1) zd.push({num:prefix,boxes:ansPF()}); else st.forEach((_,k)=> zd.push({num:`${prefix}.${k+1}`,boxes:ansPF()})); }
    else if(it.type==='matching'){ const L=it.left||[], R=(it.right||[]).length||4; if(L.length<=1) zd.push({num:prefix,boxes:ansLetters(R)}); else L.forEach((_,k)=> zd.push({num:`${prefix}.${k+1}`,boxes:ansLetters(R)})); }
  };
  const pushOpen=(prefix,it)=>{
    if(it.type==='essay'){ const c=(it.criteria&&it.criteria.length)?it.criteria:[{name:'Punkty',max:parseInt(it.points)||0}]; essays.push({num:prefix, criteria:c}); }
    else { egz.push({num:prefix, max:parseInt(it.points)||0}); }
  };
  state.tasks.forEach((t,i)=>{
    const P=`${i+1}`;
    if(t.type==='divided'){ (t.subtasks||[]).forEach((s,si)=>{ const sp=`${i+1}.${si+1}`; if(isClosedType(s.type)) pushClosed(sp,s); else pushOpen(sp,s); }); }
    else if(isClosedType(t.type)) pushClosed(P,t);
    else pushOpen(P,t);
  });
  return {zd,egz,essays};
}
function answerCardHTML(){
  const m=state.meta; const {zd,egz,essays}=collectAnswer();
  let h=`<div class="answer-card fullpage">`;
  h+=`<div class="ac-top"><div class="ac-title">WYPEŁNIA ZESPÓŁ NADZORUJĄCY</div><div class="ac-code">${esc((m.subject||'').toUpperCase())}${m.formula?` · ${esc(m.formula)}`:''}</div></div>`;
  h+=`<div class="ac-chk"><span class="chkbox"></span> Uprawnienia zdającego do nieprzenoszenia odpowiedzi na kartę odpowiedzi.<br><span class="chkbox"></span> Uprawnienia zdającego do dostosowania zasad oceniania.</div>`;
  h+=`<div class="ac-band">WYPEŁNIA ZDAJĄCY</div>`;
  h+=`<div class="ac-pesel"><span class="lb">PESEL</span>${cells(11)}<span class="ac-naklejka">Miejsce na naklejkę z kodem</span></div>`;
  h+=`<div class="ac-sub">Odpowiedzi do zadań zamkniętych</div>`;
  h+=`<div class="acard-grid">`;
  if(!zd.length) h+=`<div class="tiny" style="color:#888">— brak zadań zamkniętych —</div>`;
  zd.forEach(r=> h+=`<div class="acard-row"><span class="anum">${esc(r.num)}</span><span class="aboxes">${r.boxes}</span></div>`);
  h+=`</div>`;
  if(egz.length||essays.length){
    h+=`<div class="ac-band">WYPEŁNIA EGZAMINATOR</div>`;
    h+=`<div class="ac-sub">Zadania otwarte — liczba przyznanych punktów</div>`;
    if(egz.length){ h+=`<div class="acard-grid">`; egz.forEach(r=> h+=`<div class="acard-row egz"><span class="anum">${esc(r.num)}</span><span class="aboxes">${ptsBoxes(r.max)}</span></div>`); h+=`</div>`; }
    essays.forEach(es=>{
      const colMax=Math.max(1,...es.criteria.map(c=>parseInt(c.max)||0));
      h+=`<table class="essay-tab"><caption>ZADANIE ${esc(es.num)} — wypracowanie</caption>`;
      h+=`<tr><th>Kryterium / punkty</th>${Array.from({length:colMax+1},(_,k)=>`<td class="pbox">${k}</td>`).join('')}</tr>`;
      es.criteria.forEach(c=>{ const cm=parseInt(c.max)||0; h+=`<tr><th>${esc(c.name||'—')}</th>${Array.from({length:colMax+1},(_,k)=> k<=cm?`<td class="pbox">${k}</td>`:`<td class="pbox empty"></td>`).join('')}</tr>`; });
      h+=`</table>`;
    });
  }
  h+=`</div>`;
  return h;
}
function materialsHTML(item){
  let h='';
  (item.sources||[]).forEach((s,si)=>{
    const multi=(item.sources||[]).length>1;
    h+=`<div class="task-src">${multi?`<div class="src-no">Źródło ${si+1}</div>`:''}${richText(s.text)}${s.label?`<div class="src-cap">${esc(s.label)}</div>`:''}</div>`;
  });
  (item.images||[]).forEach((im,ii)=>{
    if(!im.data) return;
    const multi=(item.images||[]).filter(x=>x.data).length>1;
    const cap = im.caption ? `${multi?`Ilustracja ${ii+1}. `:''}${esc(im.caption)}` : (multi?`Ilustracja ${ii+1}`:'');
    h+=`<figure class="task-fig"><img class="task-img" src="${im.data}">${cap?`<figcaption class="src-cap" style="text-align:center">${cap}</figcaption>`:''}</figure>`;
  });
  return h;
}
function hasMaterials(t){ return ((t.sources&&t.sources.length)||(t.images&&t.images.some(im=>im.data))); }
function answerHTML(t, showKey){
  let h='';
  if(t.type==='closed'||t.type==='math_closed'){
    (t.options||[]).forEach((o,oi)=>{ const lt=String.fromCharCode(65+oi); const ok=showKey&&t.correct===oi; h+=`<div class="opt ${ok?'correct':''}"><span class="lt">${lt}.</span>${richText(o)}${ok?' ✓':''}</div>`; });
    if(t.type==='math_closed') h+=`<div class="scratch"><div class="sl">Brudnopis</div><div class="workbox grid" style="min-height:${t.scratchmm||45}mm"></div></div>`;
  }
  else if(t.type==='truefalse'){
    (t.statements||[]).forEach((st,si)=>{ const p=showKey&&st.ans==='P',f=showKey&&st.ans==='F'; h+=`<div class="tf-row"><span class="st">${si+1}. ${richText(st.text)}</span><span class="pf"><span class="${p?'on':''}">P</span> / <span class="${f?'on':''}">F</span></span></div>`; });
  }
  else if(t.type==='matching'){
    h+=`<div class="match-wrap"><div class="col"><b>Kolumna I</b><ol>`;
    (t.left||[]).forEach(Lx=> h+=`<li>${richText(Lx.text)} …….</li>`);
    h+=`</ol></div><div class="col"><b>Kolumna II</b><ul>`;
    (t.right||[]).forEach((R,ri)=> h+=`<li>${String.fromCharCode(65+ri)}. ${richText(R)}</li>`);
    h+=`</ul></div></div>`;
    if(showKey) h+=`<div class="match-key">Klucz: ${esc((t.left||[]).map((Lx,li)=>`${li+1}–${Lx.correct||'?'}`).join(', '))}</div>`;
  }
  else if(t.type==='rozstrzygniecie'){
    h+=`<div class="rz-lab">Rozstrzygnięcie:</div><div class="wl"></div>`;
    if(showKey && t.answer) h+=`<div class="match-key">Klucz: ${esc(t.answer)}</div>`;
    h+=`<div class="rz-lab" style="margin-top:10px">Uzasadnienie:</div>${writeLines(t.lines||4)}`;
  }
  else if(t.type==='math_open'){ h+=`<div class="workbox grid" style="min-height:${t.heightmm||200}mm"></div>`; }
  else if(t.type==='essay'){ h+=writeLines(t.lines||16); }
  else if(['open','gaps','source','image'].includes(t.type)){ h+=writeLines(t.lines==null?4:t.lines); }
  if(showKey && t.keyNote) h+=`<div class="match-key">Klucz: ${richText(t.keyNote)}</div>`;
  return h;
}
function renderSheet(showKey){
  const m=state.meta, sheet=document.getElementById('sheet'), max=totalPoints();
  sheet.className='sheet mode-'+m.mode+(isAnnualExam(m)?' exam-blue':'');
  let h='';
  if(m.mode==='exam'){
    h+=`<div class="exam-top">
          <div class="brand"><svg width="20" height="20" viewBox="0 0 100 100"><polygon points="50,22 90,42 50,62 10,42" fill="currentColor"/></svg> ARKUSZ EGZAMINACYJNY</div>
          <div style="max-width:52%; text-align:right">Arkusz zawiera informacje prawnie chronione do momentu rozpoczęcia egzaminu.</div>
        </div>`;
    h+=`<div class="exam-fill"><div class="bar">Wypełnia zdający</div>

    h+=`<div class="exam-meta">${m.date?`DATA: <b>${esc(m.date)}</b><br>`:''}${m.duration?`CZAS TRWANIA: <b>${esc(m.duration)} minut</b><br>`:''}LICZBA PUNKTÓW DO UZYSKANIA: <b>${max}</b></div>`;
    h+=`<div class="exam-instr fullpage"><div class="em-mark">${EM_MARK(m)}</div><h2 class="ei-h">Instrukcja dla zdającego</h2><ol class="ei-list">${instrLines(m.examInstruction)}</ol></div>`;
  } else {
    h+=`<div class="test-head"><div class="eyebrow">${esc(m.workType)} · ${esc(m.subject)}</div><h1>${esc(m.topic||'Temat pracy')}</h1>${m.subtitle?`<div class="sub">${esc(m.subtitle)}</div>`:''}</div>`;
    h+=`<div class="test-identity">
          <div class="fld"><span class="lb">Imię i nazwisko:</span><span class="ln" style="min-width:150px"></span></div>

          <div class="fld"><span class="lb">Data:</span><span class="ln"></span></div>

          <div class="fld"><span class="lb">Ocena:</span><span class="ln" style="min-width:60px"></span></div>
        </div>`;
    if(m.instruction) h+=`<div class="instruction">${richText(m.instruction)}</div>`;
  }
  state.tasks.forEach((t,i)=>{
    const info=TYPES[t.type]; const pmax=taskPoints(t);
    const icon=`<span class="t-ic" title="${esc(info.label)}">${esc(info.icon)}</span>`;
    const fp=(t.type==='math_open'&&t.fullpage)?' fullpage':'';
    let bodyHTML='';
    if(t.content) bodyHTML+=`<div class="t-content">${richText(t.content)}</div>`;
    if(hasMaterials(t)) bodyHTML+=materialsHTML(t);
    if(t.type==='divided'){
      (t.subtasks||[]).forEach((s,si)=>{
        const sinfo=TYPES[s.type]||{icon:'',label:''}; const sp=parseInt(s.points)||0;

        bodyHTML+=`<div class="subtask"><div class="sub-head"><span class="sub-no">${i+1}.${si+1}.</span><span class="t-ic" title="${esc(sinfo.label)}">${esc(sinfo.icon)}</span>${ssym}<span class="t-pts">(0–${sp})</span></div>`;

      });
    } else {
      bodyHTML+=answerHTML(t,showKey);
    }
    if(m.mode==='test'){
      const pts=`<span class="t-pts"><span class="blank"></span> / ${pmax} pkt</span>`;
      const head=`<div class="t-head">${t.title?`<span class="t-title">${esc(t.title)}</span>`:''}${icon}${pts}</div>`;
      h+=`<div class="task${fp}"><div class="t-no">${i+1}</div><div class="t-main">${head}${bodyHTML}</div></div>`;
    } else {
      const pts=`<span class="t-pts">(0–${pmax})</span>`;
      const sym=isClosedType(t.type)?CLOSED_SYMBOL:'';
      const head=`<div class="t-head"><span class="zno">Zadanie ${i+1}.</span>${t.title?`<span class="t-title">${esc(t.title)}</span>`:''}${icon}${sym}${pts}</div>`;
      h+=`<div class="task${fp}"><div class="t-main">${head}${bodyHTML}</div></div>`;
    }
  });
  if(m.brudnopis) h+=`<div class="brudnopis fullpage"><div class="bl">BRUDNOPIS</div><div style="min-height:120mm"></div></div>`;
  if(m.mode==='exam' && m.answerCard) h+=answerCardHTML();
  h+=`<div class="sheet-foot">Przygotowano w Kreatorze prac pisemnych GAMIK · ${state.tasks.length} zad. · ${max} pkt</div>`;
  sheet.innerHTML=h;
  if(window.MathJax && MathJax.typesetPromise){ MathJax.typesetClear&&MathJax.typesetClear([sheet]); MathJax.typesetPromise([sheet]).catch(()=>{}); }
}

      {t:'math_open', p:3, h:100, c:'Rzucamy dwa razy symetryczną sześcienną kostką do gry. Oblicz prawdopodobieństwo zdarzenia, że suma wyrzuconych oczek jest równa 8.', a:'Sprzyjające wyniki: $(2,6),(3,5),(4,4),(5,3),(6,2)$; $P=\\frac{5}{36}$.'},
    ],
  },
};

function bankToTask(q){
  const t = newTask(q.t);
  t.content = q.c || '';
  if(q.p != null) t.points = q.p;
  if(q.o){ t.options = q.o.slice(); t.correct = (q.k == null ? null : q.k); }
  if(q.s) t.statements = q.s.map(([text,ans])=>({text,ans}));
  if(q.l){ t.left = q.l.map(([text,correct])=>({text,correct})); t.right = q.r.slice(); }
  if(q.src) t.sources = q.src.map(([label,text])=>({label,text}));
  if(q.n != null) t.lines = q.n;
  if(q.h) t.heightmm = q.h;
  if(q.t==='math_open') t.fullpage = false;
  if(q.t==='math_closed') t.scratchmm = 35;
  if(q.a){ if(q.t==='rozstrzygniecie') t.answer = q.a; else t.keyNote = q.a; }
  return t;
}
function bankAnswer(q){
  if(q.o) return q.k == null ? '' : String.fromCharCode(65+q.k);
  if(q.s) return q.s.map(x=>x[1]).join(', ');
  if(q.l) return q.l.map((x,i)=>`${i+1}–${x[1]}`).join(', ');
  return q.a || '';
}
function bankDetail(q){
  if(q.o) return q.o.map((o,i)=>`${String.fromCharCode(65+i)}. ${o}`).join('   ');
  if(q.s) return q.s.map((x,i)=>`${i+1}. ${x[0]}`).join('  ');
  if(q.l) return q.l.map(x=>x[0]).join(' · ') + '  ⇄  ' + q.r.join(' · ');
  if(q.src) return 'Źródło: ' + q.src.map(x=>x[0]).join('; ');
  return '';
}
function typesetMath(node){
  if(window.MathJax && MathJax.typesetPromise){ MathJax.typesetClear && MathJax.typesetClear([node]); MathJax.typesetPromise([node]).catch(()=>{}); }
}

const bankSel = { subject:null, section:null };
function addFromBank(list){
  list.forEach(q=> state.tasks.push(bankToTask(q)));
  renderTasks();
}
function renderBank(){
  const box = document.getElementById('bank'); if(!box) return;
  const subjects = Object.keys(BANK);
  if(!subjects.includes(bankSel.subject)) bankSel.subject = subjects.includes(state.meta.subject) ? state.meta.subject : subjects[0];
  const sections = Object.keys(BANK[bankSel.subject]);
  if(!sections.includes(bankSel.section)) bankSel.section = sections[0];
  const list = BANK[bankSel.subject][bankSel.section];
  const total = list.reduce((a,q)=> a + taskPoints(bankToTask(q)), 0);

  box.innerHTML = `
    <h2>Baza gotowych pytań</h2>
    <div class="bank-bar">
      <label class="f">Przedmiot<select id="bank-subject">${subjects.map(s=>`<option ${s===bankSel.subject?'selected':''}>${esc(s)}</option>`).join('')}</select></label>
      <label class="f">Dział<select id="bank-section">${sections.map(s=>`<option ${s===bankSel.section?'selected':''}>${esc(s)}</option>`).join('')}</select></label>
      <button class="btn ghost" id="bank-all">Dodaj cały dział (${list.length} zad., ${total} pkt)</button>
    </div>
    <div class="hintline" style="margin:0 0 4px">Pytanie trafia do arkusza jako kopia — po dodaniu możesz je dowolnie zmienić. Odpowiedzi widać tylko tutaj i w podglądzie z kluczem.</div>
    <div id="bank-list"></div>`;
  box.querySelector('#bank-subject').onchange = e=>{ bankSel.subject = e.target.value; bankSel.section = null; renderBank(); };
  box.querySelector('#bank-section').onchange = e=>{ bankSel.section = e.target.value; renderBank(); };
  box.querySelector('#bank-all').onclick = e=>{ addFromBank(list); flashAdded(e.currentTarget, 'Dodano cały dział ✓'); };

  const out = box.querySelector('#bank-list');
  list.forEach(q=>{
    const info = TYPES[q.t], ans = bankAnswer(q), det = bankDetail(q);
    const pts = taskPoints(bankToTask(q));
    const row = el(`<div class="bank-row">
      <span class="ic" title="${esc(info.label)}">${esc(info.icon)}</span>
      <div class="bank-q">
        <div>${esc(q.c).replace(/\n/g,'<br>')}</div>
        ${det?`<div class="det">${esc(det)}</div>`:''}
        ${ans?`<div class="ans"><b>Odp.:</b> ${esc(ans)}</div>`:''}
      </div>
      <span class="bank-meta">${pts} pkt</span>
      <button class="btn ghost sm">Dodaj</button>
    </div>`);
    row.querySelector('button').onclick = e=>{ addFromBank([q]); flashAdded(e.currentTarget, 'Dodano ✓'); };
    out.appendChild(row);
  });
  typesetMath(out);
}
function flashAdded(btn, text){
  const old = btn.textContent; btn.textContent = text; btn.disabled = true;
  setTimeout(()=>{ btn.textContent = old; btn.disabled = false; }, 1100);
}
/* zmiana przedmiotu arkusza przełącza też bazę pytań */
settings.addEventListener('change', e=>{ if(e.target.id==='s-subject'){ bankSel.subject = e.target.value; bankSel.section = null; renderBank(); } });
window.addEventListener('load', ()=> renderBank());   /* wzory w bazie — po załadowaniu MathJax */

/* ===== zapis / wczytanie ===== */
document.getElementById('btn-save').onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  const name=(state.meta.topic||state.meta.workType||'praca').replace(/[^a-z0-9ąćęłńóśźż _-]/gi,'').trim()||'praca';
  a.href=URL.createObjectURL(blob); a.download=name+'.gamik.json'; a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('btn-load').onclick=()=> document.getElementById('file-load').click();
document.getElementById('file-load').onchange=e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{
    const obj=JSON.parse(r.result); if(!obj.meta||!Array.isArray(obj.tasks)) throw new Error('Zły format');
    // normalizacja starszych plików
    if(!obj.meta.mode) obj.meta.mode='test';
    if(!obj.meta.instruction) obj.meta.instruction=DEF_INSTR;
    if(!obj.meta.examInstruction) obj.meta.examInstruction=DEF_EXAM_INSTR;
    if(obj.meta.answerCard===undefined) obj.meta.answerCard=true;
    obj.tasks.forEach(t=>{
      if(t.type==='math') t.type='math_open';
      if(t.title===undefined) t.title='';
      if(t.source!==undefined||t.sourceLabel!==undefined){ t.sources=t.source?[{label:t.sourceLabel||'Źródło',text:t.source}]:[]; delete t.source; delete t.sourceLabel; }
      if(t.image!==undefined||t.caption!==undefined){ t.images=t.image?[{data:t.image,caption:t.caption||''}]:[]; delete t.image; delete t.caption; }
      if(['source','image','rozstrzygniecie','divided'].includes(t.type)){ t.sources=t.sources||[]; t.images=t.images||[]; }
      if(t.type==='divided') t.subtasks=t.subtasks||[];
      if(t.type==='essay' && !t.criteria) t.criteria=[{name:'Treść',max:5},{name:'Kompozycja',max:3},{name:'Język',max:4}];
    });
    state=obj; renderSettings(); renderTasks(); showEditor();
  }catch(err){ alert('Nie udało się wczytać pliku: '+err.message); } };
  r.readAsText(f); e.target.value='';
};

/* ===== boot ===== */
initMeta(); renderSettings(); renderTasks(); renderBank();
</script>
