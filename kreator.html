<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kreator prac pisemnych — GAMIK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  window.MathJax = {
    tex:{ inlineMath:[['$','$'],['\\(','\\)']], displayMath:[['$$','$$'],['\\[','\\]']] },
    svg:{ fontCache:'global' }, startup:{ typeset:false }
  };
</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>
<style>
  :root{
    --bg:#e8eaed; --paper:#fff; --ink:#15181d; --muted:#697079; --muted-2:#9aa0a8;
    --line:#d5d9df; --line-2:#c3c9d1; --accent:#2f5a8f; --accent-d:#244870; --soft:#eef2f8;
    --radius:12px; --radius-sm:8px; --sans:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:var(--sans); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; font-size:14.5px; line-height:1.5}
  button{font-family:inherit; cursor:pointer} input,select,textarea{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

  /* chrome */
  .chrome-top{position:sticky; top:0; z-index:30; background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; padding:11px 20px; flex-wrap:wrap}
  .mark{display:flex; align-items:center; gap:10px; font-weight:600}
  .mark .t b{font-weight:700} .mark .t span{color:var(--muted); font-weight:500}
  .grow{flex:1}
  .toolbtns{display:flex; gap:8px; flex-wrap:wrap}
  .btn{border:1px solid var(--accent); background:var(--accent); color:#fff; padding:8px 14px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:600}
  .btn:hover{opacity:.9}
  .btn.ghost{background:#fff; color:var(--ink); border-color:var(--line-2)} .btn.ghost:hover{background:#f6f7f9}
  .btn.sm{padding:5px 10px; font-size:12.5px}
  .btn.icon{padding:5px 9px; background:#fff; color:var(--ink); border-color:var(--line-2)} .btn.icon:hover{background:#f2f4f7}
  .btn.danger{background:#fff; color:#b3261e; border-color:#e6c3c1} .btn.danger:hover{background:#fbf0ef}

  .wrap{max-width:900px; margin:0 auto; padding:22px 18px 90px}
  .block{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px}
  .block > h2{font-size:12px; color:var(--muted); margin:0 0 14px; font-weight:700}
  .fields{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
  .fields .full{grid-column:1/-1}
  @media(max-width:620px){ .fields{grid-template-columns:1fr} }
  label.f{display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--muted)}
  label.f input, label.f select, label.f textarea{font-size:14px; color:var(--ink); background:#fff; border:1px solid var(--line-2); border-radius:var(--radius-sm); padding:9px 11px; font-weight:400}
  label.f textarea{resize:vertical; min-height:64px; line-height:1.5}
  label.f input:focus, label.f select:focus, label.f textarea:focus{border-color:var(--accent); outline:1px solid var(--accent)}

  .seg{display:inline-flex; gap:3px; background:var(--bg); padding:4px; border-radius:999px; margin-bottom:16px}
  .seg button{border:0; background:transparent; padding:8px 18px; border-radius:999px; font-weight:600; font-size:13.5px; color:var(--muted)}
  .seg button.active{background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}

  .palette{display:flex; flex-wrap:wrap; gap:8px}
  .palette button{border:1px solid var(--line-2); background:#fff; color:var(--ink); border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:8px}
  .palette button:hover{border-color:var(--accent); color:var(--accent); background:var(--soft)}
  .palette .ic{display:inline-grid; place-items:center; min-width:20px; height:18px; border-radius:5px; background:var(--soft); color:var(--accent); font-size:11px; font-weight:700; padding:0 4px}

  .mathbar{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .mathbar .lab{font-size:12px; color:var(--muted); font-weight:600; margin-right:2px}
  .mathbar button{border:1px solid var(--line-2); background:#fff; border-radius:6px; padding:4px 9px; font-size:14px}
  .mathbar button:hover{background:var(--soft); border-color:var(--accent)}

  .task-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:14px; overflow:hidden}
  .tc-head{display:flex; align-items:center; gap:10px; padding:11px 14px; background:#f7f8fa; border-bottom:1px solid var(--line)}
  .tc-num{font-weight:700; font-size:14px}
  .tc-type{font-size:12px; color:var(--muted); font-weight:600; padding:2px 9px; border:1px solid var(--line-2); border-radius:999px; background:#fff; display:inline-flex; gap:6px; align-items:center}
  .tc-type .ic{font-weight:700; color:var(--accent)}
  .tc-pts{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); font-weight:600}
  .tc-pts input{width:56px; text-align:center; border:1px solid var(--line-2); border-radius:6px; padding:5px; font-size:14px; font-weight:600}
  .tc-body{padding:14px}
  .opt-row{display:flex; align-items:center; gap:8px; margin-bottom:7px}
  .opt-row .let{width:22px; height:22px; border-radius:5px; background:var(--soft); color:var(--accent); display:grid; place-items:center; font-weight:700; font-size:12px; flex:0 0 auto}
  .opt-row input[type=text]{flex:1; border:1px solid var(--line-2); border-radius:6px; padding:7px 9px; font-size:14px}
  .opt-row .key{display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--muted); white-space:nowrap}
  .mini{border:1px solid var(--line-2); background:#fff; border-radius:6px; padding:4px 9px; font-size:12.5px; font-weight:600; color:var(--muted)}
  .mini:hover{color:var(--accent); border-color:var(--accent)}
  .hintline{font-size:12px; color:var(--muted-2); margin-top:6px}
  .imgprev{max-width:220px; max-height:150px; border:1px solid var(--line); border-radius:8px; margin-top:8px; display:block}
  .empty{text-align:center; color:var(--muted-2); padding:34px; border:1px dashed var(--line-2); border-radius:var(--radius); background:#fff}

  /* ============ ARKUSZ ============ */
  .stage{display:none}
  body.previewing .editor{display:none}
  body.previewing .stage{display:block}

  .sheet{background:#fff; color:#111; font-family:var(--sans); width:210mm; max-width:100%;
    margin:0 auto 40px; padding:16mm 15mm; box-shadow:0 3px 40px rgba(20,24,31,.14); border:1px solid #e3e3e3; line-height:1.5; font-size:11.6pt}
  .sheet.mode-test{ --ac:#35707a; --ac-d:#2a5960; --ac-soft:#e7f0f1 }
  .sheet.mode-exam{ --ac:#6a4a9c; --ac-d:#523a7d; --ac-soft:#ece3f5 }

  /* --- TEST --- */
  .test-head{background:var(--ac); color:#fff; padding:18px 22px; border-radius:5px}
  .test-head .eyebrow{font-size:10pt; letter-spacing:.12em; text-transform:uppercase; font-weight:600; opacity:.9}
  .test-head h1{font-size:20pt; margin:7px 0 0; font-weight:800; line-height:1.15}
  .test-head .sub{font-size:11pt; margin-top:5px; opacity:.92; font-weight:400}
  .test-identity{display:flex; flex-wrap:wrap; gap:7px 26px; margin:16px 2px 6px; font-size:11pt; align-items:baseline}
  .test-identity .fld{display:flex; gap:8px; align-items:baseline}
  .test-identity .fld .lb{font-weight:600; white-space:nowrap}
  .test-identity .fld .ln{border-bottom:1px solid #111; min-width:70px; display:inline-block; height:14px}

  /* --- EXAM (matura style) --- */
  .exam-top{display:flex; justify-content:space-between; gap:16px; font-size:8pt; color:#6d6d6d}
  .exam-top .brand{display:flex; align-items:center; gap:8px; color:var(--ac-d); font-weight:800; letter-spacing:.04em; font-size:9pt}
  .exam-fill{border:1px solid var(--ac); border-radius:3px; margin-top:8px; overflow:hidden}
  .exam-fill .bar{background:var(--ac-soft); color:var(--ac-d); font-weight:700; font-size:8.5pt; letter-spacing:.1em; padding:4px 12px; text-transform:uppercase}
  .codes{display:flex; gap:26px; padding:9px 12px; align-items:center; flex-wrap:wrap}
  .codes .grp{display:flex; align-items:center; gap:8px; font-size:9pt; font-weight:700}
  .cells{display:flex; gap:3px}
  .cell{width:15px; height:20px; border:1px solid #555; border-radius:2px}
  .exam-band{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap}
  .exam-band .wt{background:var(--ac-soft); color:var(--ac-d); font-weight:800; font-size:13pt; padding:7px 16px; border-radius:3px}
  .exam-band .fm{color:var(--ac-d); font-weight:800; font-size:12pt; font-style:italic}
  .exam-title{background:var(--ac); color:#fff; border-radius:4px; padding:16px 20px; margin-top:12px}
  .exam-title .subj{font-size:27pt; font-weight:800; letter-spacing:.01em; line-height:1.05}
  .exam-title .lvl{display:inline-block; margin-top:10px; background:rgba(255,255,255,.2); padding:4px 14px; border-radius:3px; font-size:13pt; font-weight:700}
  .exam-topic{font-size:12pt; margin-top:12px; font-weight:600}
  .exam-topic .lab{color:#555; font-weight:400; font-style:italic; margin-right:6px}
  .exam-meta{margin-top:14px; font-size:11.5pt; line-height:1.95}
  .exam-meta b{font-size:12.5pt}

  .instruction{font-size:10.5pt; color:#1a1a1a; padding:10px 0 2px; margin-top:12px}
  .instruction .ih{font-weight:700; margin-bottom:4px}
  .sheet-rule{border:0; border-top:2px solid var(--ac); margin:14px 0}

  .task{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid #e3e3e3; align-items:flex-start}
  .task:last-of-type{border-bottom:0}
  .t-no{width:26px; height:26px; border-radius:7px; background:var(--ac); color:#fff; display:grid; place-items:center; font-weight:700; font-size:12pt; flex:0 0 auto}
  .t-main{flex:1; min-width:0}
  .t-head{display:flex; align-items:baseline; gap:9px; margin-bottom:2px}
  .t-head .t-title{font-weight:700; font-size:12.5pt}
  .t-head .zno{font-weight:700; font-size:12pt}
  .t-ic{display:inline-grid; place-items:center; min-width:20px; height:17px; padding:0 5px; border:1px solid #cfcfcf; border-radius:5px; font-size:8.5pt; color:#6b6b6b; background:#f6f6f6; font-weight:700}
  .t-pts{margin-left:auto; white-space:nowrap; color:#555; font-size:10.5pt; font-weight:600}
  .t-pts .blank{display:inline-block; border-bottom:1px solid #888; width:24px; height:12px; vertical-align:baseline}
  .t-content{white-space:normal; margin:3px 0}
  .t-content.italic{font-style:italic; color:#333}
  .task-src{border:1px solid #111; padding:10px 12px; margin:8px 0; font-size:10.5pt; background:#fbfbfb}
  .task-src .src-cap{font-size:9pt; font-style:italic; color:#333; margin-top:6px; text-align:right}
  .task-img{max-width:100%; max-height:80mm; display:block; margin:8px auto; border:1px solid #111}
  .opt{margin:5px 0 0 2px}
  .opt .lt{font-weight:700; margin-right:7px}
  .opt.correct{background:#eef7f0}
  .tf-row{display:flex; align-items:center; gap:14px; margin:5px 0}
  .tf-row .st{flex:1}
  .tf-row .pf{font-weight:700; letter-spacing:.1em; white-space:nowrap}
  .tf-row .pf .on{color:#1c7a43; text-decoration:underline}
  .match-wrap{display:flex; gap:22px; margin-top:6px}
  .match-wrap .col{flex:1} .match-wrap ol{margin:4px 0; padding-left:22px} .match-wrap ul{margin:4px 0; padding-left:0; list-style:none}
  .match-key{font-size:10pt; margin-top:6px; color:#1c7a43}
  .writelines{margin-top:8px}
  .wl{border-bottom:1px dotted #555; height:26px}
  .workbox{margin-top:8px; border:1px solid #111}
  .workbox.grid{background-image:linear-gradient(#e3e3e3 1px,transparent 1px),linear-gradient(90deg,#e3e3e3 1px,transparent 1px); background-size:5mm 5mm}
  .scratch{margin-top:10px}
  .scratch .sl{font-size:9pt; font-weight:700; letter-spacing:.08em; color:#666; text-transform:uppercase; margin-bottom:4px}
  .t-pts-exam{margin-top:2px}

  .brudnopis{margin-top:16px; border-top:2px solid var(--ac); padding-top:8px}
  .brudnopis .bl{font-weight:700; letter-spacing:.14em; font-size:10pt; color:var(--ac-d)}
  .sheet-foot{margin-top:18px; text-align:center; font-size:8pt; color:#9a9a9a; letter-spacing:.03em}

  .preview-note{max-width:210mm; margin:0 auto 14px; font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .switchkey{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink); font-weight:600}

  @media(max-width:840px){ .sheet{padding:10mm 8mm} }

  @media print{
    .chrome-top,.editor,.preview-note,.noprint{display:none !important}
    body{background:#fff}
    body .stage{display:block}
    .sheet{box-shadow:none; border:0; margin:0; width:auto; max-width:none; padding:0}
    @page{size:A4; margin:12mm}
    .task,.workbox,.task-src,.exam-title,.exam-fill,.test-head{break-inside:avoid}
    .t-head{break-after:avoid}
    .fullpage{break-before:page}
  }
</style>
</head>
<body>
<div class="chrome-top">
  <div class="mark">
    <svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,22 90,42 50,62 10,42" fill="#2f5a8f"/>
      <path d="M32 54 v13 c0 6 8 11 18 11 s18-5 18-11 V54 L50 63 Z" fill="#2f5a8f"/>
    </svg>
    <span class="t"><b>Kreator prac pisemnych</b> <span>· GAMIK</span></span>
  </div>
  <div class="grow"></div>
  <div class="toolbtns">
    <button class="btn ghost" id="btn-edit" style="display:none">← Wróć do edycji</button>
    <button class="btn ghost" id="btn-save">Zapisz plik</button>
    <button class="btn ghost" id="btn-load">Wczytaj</button>
    <button class="btn ghost" id="btn-preview">Podgląd</button>
    <button class="btn" id="btn-print">Drukuj / PDF</button>
  </div>
  <input type="file" id="file-load" accept="application/json" style="display:none">
</div>

<div class="wrap">
  <div class="editor" id="editor">
    <div class="block" id="settings"></div>

    <div class="block">
      <h2>Wstaw wzór matematyczny (do aktywnego pola)</h2>
      <div class="mathbar" id="mathbar"><span class="lab">Symbole:</span></div>
    </div>

    <div class="block">
      <h2>Dodaj zadanie</h2>
      <div class="palette" id="palette"></div>
    </div>

    <div id="tasks"></div>
  </div>

  <div class="stage" id="stage">
    <div class="preview-note noprint">
      <span>Podgląd arkusza — tak wydrukuje się praca.</span>
      <label class="switchkey"><input type="checkbox" id="chk-key"> Pokaż klucz odpowiedzi</label>
    </div>
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<script>
/* ===== helpers ===== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el = h => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; };
const uid = () => 'z'+Math.random().toString(36).slice(2,9);

const TYPES = {
  closed:     {label:'Zamknięte (wybór)',       icon:'ABC'},
  truefalse:  {label:'Prawda / Fałsz',          icon:'P/F'},
  matching:   {label:'Na dobieranie',           icon:'⇄'},
  gaps:       {label:'Uzupełnianie luk',        icon:'▁▁'},
  open:       {label:'Otwarte',                 icon:'✎'},
  source:     {label:'Ze źródłem',              icon:'❝'},
  image:      {label:'Z obrazem / mapą',        icon:'▦'},
  essay:      {label:'Wypracowanie',            icon:'¶'},
  math_closed:{label:'Matematyczne — zamknięte',icon:'∑·ABC'},
  math_open:  {label:'Matematyczne — otwarte',  icon:'∑·▦'},
};
const WORKTYPES = {
  test: ['Kartkówka','Sprawdzian'],
  exam: ['Egzamin roczny diagnostyczny','Egzamin maturalny diagnostyczny'],
};
const DEF_INSTR = 'Przeczytaj uważnie polecenia. Pisz czytelnie. W zadaniach zamkniętych zaznacz poprawną odpowiedź. Nie używaj korektora.';

let state = { meta:{}, tasks:[] };
let activeField = null;

function newTask(type){
  const b = { id:uid(), type, title:'', content:'', points:2 };
  if(type==='closed')      return {...b, options:['','',''], correct:null};
  if(type==='truefalse')   return {...b, statements:[{text:'',ans:null},{text:'',ans:null}]};
  if(type==='matching')    return {...b, left:[{text:'',correct:''}], right:['','']};
  if(type==='gaps')        return {...b, lines:2};
  if(type==='open')        return {...b, lines:4};
  if(type==='source')      return {...b, source:'', sourceLabel:'Źródło', lines:5};
  if(type==='image')       return {...b, image:null, caption:'', lines:5};
  if(type==='essay')       return {...b, points:15, lines:18};
  if(type==='math_closed') return {...b, points:1, options:['','','',''], correct:null, scratchmm:45};
  if(type==='math_open')   return {...b, points:6, heightmm:200, fullpage:true};
  return b;
}

function initMeta(){
  state.meta = { mode:'test', subject:'Historia', workType:'Sprawdzian', level:'',
    formula:'Formuła 2023', topic:'', subtitle:'', klasa:'', duration:'45', date:'',
    instruction:DEF_INSTR, brudnopis:false };
}

/* ===== settings (zależne od trybu) ===== */
const settings = document.getElementById('settings');
function bindVal(id,key){ const e=document.getElementById(id); if(e) e.addEventListener('input', ev=> state.meta[key]=ev.target.value); }
function renderSettings(){
  const m=state.meta;
  const wt=WORKTYPES[m.mode]; if(!wt.includes(m.workType)) m.workType=wt[0];
  const wtOpts=wt.map(x=>`<option ${m.workType===x?'selected':''}>${esc(x)}</option>`).join('');
  const subjOpts=['Historia','Wiedza o społeczeństwie','Matematyka'].map(x=>`<option ${m.subject===x?'selected':''}>${esc(x)}</option>`).join('');
  let modeFields='';
  if(m.mode==='exam'){
    const lv=['','Poziom podstawowy','Poziom rozszerzony'];
    modeFields=`
      <label class="f">Poziom<select id="s-level">${lv.map(x=>`<option value="${esc(x)}" ${m.level===x?'selected':''}>${x?esc(x):'— brak —'}</option>`).join('')}</select></label>
      <label class="f">Formuła / oznaczenie<input id="s-formula" value="${esc(m.formula)}" placeholder="np. Formuła 2023"></label>`;
  } else {
    modeFields=`
      <label class="f">Klasa<input id="s-klasa" value="${esc(m.klasa)}" placeholder="np. 8a"></label>
      <label class="f">Podtytuł (opis)<input id="s-subtitle" value="${esc(m.subtitle)}" placeholder="np. zakres materiału / działy"></label>`;
  }
  settings.innerHTML=`
    <h2>Ustawienia arkusza</h2>
    <div class="seg" id="mode-seg">
      <button data-m="test" class="${m.mode==='test'?'active':''}">Test (karta pracy)</button>
      <button data-m="exam" class="${m.mode==='exam'?'active':''}">Egzamin (styl maturalny)</button>
    </div>
    <div class="fields">
      <label class="f">Przedmiot<select id="s-subject">${subjOpts}</select></label>
      <label class="f">Rodzaj pracy<select id="s-worktype">${wtOpts}</select></label>
      <label class="f full">Temat<input id="s-topic" value="${esc(m.topic)}" placeholder="np. II wojna światowa"></label>
      ${modeFields}
      <label class="f">Czas (min)<input id="s-duration" value="${esc(m.duration)}" placeholder="45"></label>
      <label class="f">Data<input id="s-date" value="${esc(m.date)}" placeholder="np. 6 maja 2025 r."></label>
      <label class="f full">Instrukcja dla ucznia<textarea id="s-instruction">${esc(m.instruction)}</textarea></label>
      <label class="f full" style="flex-direction:row; align-items:center; gap:8px"><input type="checkbox" id="s-brudnopis" ${m.brudnopis?'checked':''}> Dodaj brudnopis na końcu</label>
    </div>`;
  settings.querySelector('#mode-seg').querySelectorAll('button').forEach(b=> b.onclick=()=>{ state.meta.mode=b.dataset.m; renderSettings(); });
  bindVal('s-subject','subject'); bindVal('s-worktype','workType'); bindVal('s-topic','topic');
  bindVal('s-duration','duration'); bindVal('s-date','date'); bindVal('s-instruction','instruction');
  if(m.mode==='exam'){ bindVal('s-level','level'); bindVal('s-formula','formula'); }
  else { bindVal('s-klasa','klasa'); bindVal('s-subtitle','subtitle'); }
  settings.querySelector('#s-brudnopis').onchange=e=> state.meta.brudnopis=e.target.checked;
}

/* ===== palette ===== */
const palette=document.getElementById('palette');
Object.entries(TYPES).forEach(([type,info])=>{
  const b=el(`<button><span class="ic">${esc(info.icon)}</span>${esc(info.label)}</button>`);
  b.onclick=()=>{ state.tasks.push(newTask(type)); renderTasks(); const c=document.querySelector('.task-card:last-child'); c&&c.scrollIntoView({behavior:'smooth',block:'center'}); };
  palette.appendChild(b);
});

/* ===== math toolbar ===== */
const MATH=[['x²','^{}'],['x₁','_{}'],['√','\\sqrt{}'],['ⁿ√','\\sqrt[n]{}'],['a/b','\\frac{}{}'],['·','\\cdot '],['×','\\times '],['÷','\\div '],['±','\\pm '],['≤','\\leq '],['≥','\\geq '],['≠','\\neq '],['π','\\pi '],['°','^{\\circ}'],['∠','\\angle '],['Δ','\\Delta '],['∑','\\sum_{}^{}'],['∫','\\int_{}^{}'],['→','\\to '],['∞','\\infty ']];
const mathbar=document.getElementById('mathbar');
MATH.forEach(([lab,sn])=>{ const b=el(`<button type="button" title="${esc(sn)}">${esc(lab)}</button>`); b.onmousedown=e=>e.preventDefault(); b.onclick=()=>insertMath(sn); mathbar.appendChild(b); });
const hb=el(`<button type="button" style="font-family:var(--sans); font-size:12px">$…$</button>`); hb.onmousedown=e=>e.preventDefault(); hb.onclick=()=>insertMath('$$',true); mathbar.appendChild(hb);
document.addEventListener('focusin', e=>{ if(e.target.matches('textarea, input[type=text]')) activeField=e.target; });
function insertMath(sn, wrap){
  const f=activeField; if(!f){ alert('Kliknij najpierw w pole tekstowe, do którego wstawić wzór.'); return; }
  const s=f.selectionStart??f.value.length, e2=f.selectionEnd??f.value.length;
  let ins, caret;
  if(wrap){ ins='$'+f.value.slice(s,e2)+'$'; caret=s+1; }
  else{
    const before=f.value.slice(0,s); const inside=((before.match(/\$/g)||[]).length)%2===1;
    ins=inside?sn:'$'+sn+'$'; const br=sn.indexOf('{}'); caret=s+(inside?0:1)+(br>=0?br+1:sn.length);
  }
  f.value=f.value.slice(0,s)+ins+f.value.slice(e2); f.dispatchEvent(new Event('input',{bubbles:true})); f.focus(); f.setSelectionRange(caret,caret);
}

/* ===== task editors ===== */
const tasksBox=document.getElementById('tasks');
function renderTasks(){
  tasksBox.innerHTML='';
  if(!state.tasks.length){ tasksBox.appendChild(el(`<div class="empty">Brak zadań. Wybierz typ zadania powyżej, aby zacząć.</div>`)); return; }
  state.tasks.forEach((t,i)=> tasksBox.appendChild(taskCard(t,i)));
}
function fieldInput(task,key,opts,area){
  const tag=area?`<textarea>${esc(task[key]||'')}</textarea>`:`<input type="text" value="${esc(task[key]||'')}">`;
  const w=el(`<label class="f full">${esc(opts.label)}${tag}</label>`);
  const inp=w.querySelector(area?'textarea':'input'); if(opts.placeholder) inp.placeholder=opts.placeholder;
  inp.oninput=()=> task[key]=inp.value; return w;
}
function linesField(task,key,label,max){
  const w=el(`<label class="f" style="max-width:260px"><span>${esc(label)}</span><input type="number" min="0" step="1" value="${task[key]||0}"></label>`);
  w.querySelector('input').oninput=e=> task[key]=parseInt(e.target.value)||0; return w;
}
function optionsEditor(task){
  const wrap=el(`<div><div class="hintline">Odpowiedzi (zaznacz poprawną w kluczu, jeśli chcesz):</div></div>`);
  task.options.forEach((opt,oi)=>{
    const L=String.fromCharCode(65+oi);
    const row=el(`<div class="opt-row"><span class="let">${L}</span>
      <input type="text" value="${esc(opt)}" placeholder="Odpowiedź ${L} (wzory: $x^2$)">
      <label class="key"><input type="radio" name="key-${task.id}" ${task.correct===oi?'checked':''}> poprawna</label>
      <button class="mini">✕</button></div>`);
    row.querySelector('input[type=text]').oninput=e=> task.options[oi]=e.target.value;
    row.querySelector('input[type=radio]').onchange=()=> task.correct=oi;
    row.querySelector('.mini').onclick=()=>{ task.options.splice(oi,1); if(task.correct===oi) task.correct=null; renderTasks(); };
    wrap.appendChild(row);
  });
  const add=el(`<button class="mini" style="margin-top:4px">+ dodaj odpowiedź</button>`);
  add.onclick=()=>{ task.options.push(''); renderTasks(); }; wrap.appendChild(add);
  return wrap;
}
function taskCard(task,i){
  const info=TYPES[task.type];
  const card=el(`<div class="task-card">
    <div class="tc-head">
      <span class="tc-num">Zadanie ${i+1}</span>
      <span class="tc-type"><span class="ic">${esc(info.icon)}</span>${esc(info.label)}</span>
      <span class="grow"></span>
      <span class="tc-pts">pkt <input type="number" min="0" step="1" value="${task.points}"></span>
      <button class="btn icon" title="W górę">↑</button>
      <button class="btn icon" title="W dół">↓</button>
      <button class="btn icon" title="Duplikuj">⧉</button>
      <button class="btn danger sm">Usuń</button>
    </div>
    <div class="tc-body"></div>
  </div>`);
  const ps=card.querySelector('.tc-pts input'); const bs=card.querySelectorAll('.tc-head .btn');
  ps.oninput=()=> task.points=parseInt(ps.value)||0;
  bs[0].onclick=()=>{ if(i>0){ [state.tasks[i-1],state.tasks[i]]=[state.tasks[i],state.tasks[i-1]]; renderTasks(); } };
  bs[1].onclick=()=>{ if(i<state.tasks.length-1){ [state.tasks[i+1],state.tasks[i]]=[state.tasks[i],state.tasks[i+1]]; renderTasks(); } };
  bs[2].onclick=()=>{ const c=JSON.parse(JSON.stringify(task)); c.id=uid(); state.tasks.splice(i+1,0,c); renderTasks(); };
  bs[3].onclick=()=>{ if(confirm('Usunąć zadanie '+(i+1)+'?')){ state.tasks.splice(i,1); renderTasks(); } };
  const body=card.querySelector('.tc-body');

  body.appendChild(fieldInput(task,'title',{label:'Nagłówek zadania (opcjonalnie)', placeholder:'np. Uzupełnij definicje'}, false));
  const cl = task.type==='essay' ? 'Temat i wytyczne wypracowania'
           : task.type==='source' ? 'Polecenie (do źródła)'
           : task.type==='image' ? 'Polecenie (do ilustracji)'
           : 'Treść / polecenie';
  body.appendChild(fieldInput(task,'content',{label:cl, placeholder:'Wpisz treść zadania… (wzory: $x^2+1$)'}, true));

  if(task.type==='source'){
    body.appendChild(fieldInput(task,'source',{label:'Tekst źródła', placeholder:'Wklej fragment źródła…'}, true));
    body.appendChild(fieldInput(task,'sourceLabel',{label:'Podpis źródła', placeholder:'np. Konstytucja RP, art. 2'}, false));
    body.appendChild(linesField(task,'lines','Liczba linii na odpowiedź'));
  }
  if(task.type==='image'){
    const up=el(`<label class="f full">Ilustracja / mapa (plik graficzny)<input type="file" accept="image/*"></label>`);
    up.querySelector('input').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ task.image=r.result; renderTasks(); }; r.readAsDataURL(f); };
    body.appendChild(up);
    if(task.image) body.appendChild(el(`<img class="imgprev" src="${task.image}">`));
    body.appendChild(fieldInput(task,'caption',{label:'Podpis ilustracji', placeholder:'np. Mapa Europy 1939 r.'}, false));
    body.appendChild(linesField(task,'lines','Liczba linii na odpowiedź'));
  }
  if(task.type==='closed' || task.type==='math_closed'){ body.appendChild(optionsEditor(task)); }
  if(task.type==='math_closed'){ body.appendChild(linesField(task,'scratchmm','Wysokość brudnopisu (mm)')); }
  if(task.type==='truefalse'){
    const wrap=el(`<div><div class="hintline">Zdania do oceny (P/F):</div></div>`);
    task.statements.forEach((st,si)=>{
      const row=el(`<div class="opt-row"><span class="let">${si+1}</span>
        <input type="text" value="${esc(st.text)}" placeholder="Treść zdania ${si+1}">
        <label class="key"><input type="radio" name="tf-${task.id}-${si}" ${st.ans==='P'?'checked':''}> P</label>
        <label class="key"><input type="radio" name="tf-${task.id}-${si}" ${st.ans==='F'?'checked':''}> F</label>
        <button class="mini">✕</button></div>`);
      row.querySelector('input[type=text]').oninput=e=> st.text=e.target.value;
      const rs=row.querySelectorAll('input[type=radio]'); rs[0].onchange=()=>st.ans='P'; rs[1].onchange=()=>st.ans='F';
      row.querySelector('.mini').onclick=()=>{ task.statements.splice(si,1); renderTasks(); };
      wrap.appendChild(row);
    });
    const add=el(`<button class="mini" style="margin-top:4px">+ dodaj zdanie</button>`); add.onclick=()=>{ task.statements.push({text:'',ans:null}); renderTasks(); }; wrap.appendChild(add);
    body.appendChild(wrap);
  }
  if(task.type==='matching'){
    const wrap=el(`<div><div class="hintline">Kolumna I (z opcjonalnym kluczem):</div></div>`);
    task.left.forEach((Lx,li)=>{
      const row=el(`<div class="opt-row"><span class="let">${li+1}</span>
        <input type="text" value="${esc(Lx.text)}" placeholder="Element ${li+1}">
        <span class="key">→</span><select class="mini" style="padding:6px"></select><button class="mini">✕</button></div>`);
      const sel=row.querySelector('select'); sel.appendChild(el(`<option value="">klucz…</option>`));
      task.right.forEach((R,ri)=>{ const lt=String.fromCharCode(65+ri); const o=el(`<option value="${lt}">${lt}</option>`); if(Lx.correct===lt)o.selected=true; sel.appendChild(o); });
      row.querySelector('input').oninput=e=> Lx.text=e.target.value; sel.onchange=()=> Lx.correct=sel.value;
      row.querySelector('.mini:last-child').onclick=()=>{ task.left.splice(li,1); renderTasks(); };
      wrap.appendChild(row);
    });
    const addL=el(`<button class="mini">+ element (kol. I)</button>`); addL.onclick=()=>{ task.left.push({text:'',correct:''}); renderTasks(); }; wrap.appendChild(addL);
    wrap.appendChild(el(`<div class="hintline" style="margin-top:12px">Kolumna II (możliwości):</div>`));
    task.right.forEach((R,ri)=>{
      const lt=String.fromCharCode(65+ri);
      const row=el(`<div class="opt-row"><span class="let">${lt}</span><input type="text" value="${esc(R)}" placeholder="Możliwość ${lt}"><button class="mini">✕</button></div>`);
      row.querySelector('input').oninput=e=> task.right[ri]=e.target.value;
      row.querySelector('.mini').onclick=()=>{ task.right.splice(ri,1); renderTasks(); };
      wrap.appendChild(row);
    });
    const addR=el(`<button class="mini">+ możliwość (kol. II)</button>`); addR.onclick=()=>{ task.right.push(''); renderTasks(); }; wrap.appendChild(addR);
    body.appendChild(wrap);
  }
  if(task.type==='open' || task.type==='gaps') body.appendChild(linesField(task,'lines','Liczba linii na odpowiedź'));
  if(task.type==='essay') body.appendChild(linesField(task,'lines','Liczba linii na wypracowanie'));
  if(task.type==='math_open'){
    body.appendChild(linesField(task,'heightmm','Wysokość kratownicy (mm)'));
    const g=el(`<label style="display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:var(--muted); margin-top:8px"><input type="checkbox" ${task.fullpage?'checked':''}> zadanie na osobnej stronie</label>`);
    g.querySelector('input').onchange=e=> task.fullpage=e.target.checked; body.appendChild(g);
  }
  return card;
}

/* ===== ARKUSZ ===== */
function richText(t){ return esc(t).replace(/\n/g,'<br>'); }
function totalPoints(){ return state.tasks.reduce((s,t)=> s+(parseInt(t.points)||0),0); }
function cells(n){ let s='<span class="cells">'; for(let i=0;i<n;i++) s+='<span class="cell"></span>'; return s+'</span>'; }
function writeLines(n){ n=Math.max(0,n|0); let s='<div class="writelines">'; for(let i=0;i<n;i++) s+='<div class="wl"></div>'; return s+'</div>'; }

function taskBody(t, showKey){
  let h='';
  if(t.content) h+=`<div class="t-content">${richText(t.content)}</div>`;
  if(t.type==='source' && t.source) h+=`<div class="task-src">${richText(t.source)}${t.sourceLabel?`<div class="src-cap">${esc(t.sourceLabel)}</div>`:''}</div>`;
  if(t.type==='image' && t.image){ h+=`<img class="task-img" src="${t.image}">`; if(t.caption) h+=`<div class="src-cap" style="text-align:center">${esc(t.caption)}</div>`; }
  if(t.type==='closed' || t.type==='math_closed'){
    (t.options||[]).forEach((o,oi)=>{ const lt=String.fromCharCode(65+oi); const ok=showKey&&t.correct===oi; h+=`<div class="opt ${ok?'correct':''}"><span class="lt">${lt}.</span>${richText(o)}${ok?' ✓':''}</div>`; });
  }
  if(t.type==='math_closed'){ h+=`<div class="scratch"><div class="sl">Brudnopis</div><div class="workbox grid" style="min-height:${t.scratchmm||45}mm"></div></div>`; }
  if(t.type==='truefalse'){
    (t.statements||[]).forEach((st,si)=>{ const p=showKey&&st.ans==='P',f=showKey&&st.ans==='F'; h+=`<div class="tf-row"><span class="st">${si+1}. ${richText(st.text)}</span><span class="pf"><span class="${p?'on':''}">P</span> / <span class="${f?'on':''}">F</span></span></div>`; });
  }
  if(t.type==='matching'){
    h+=`<div class="match-wrap"><div class="col"><b>Kolumna I</b><ol>`;
    (t.left||[]).forEach(Lx=> h+=`<li>${richText(Lx.text)} …….</li>`);
    h+=`</ol></div><div class="col"><b>Kolumna II</b><ul>`;
    (t.right||[]).forEach((R,ri)=> h+=`<li>${String.fromCharCode(65+ri)}. ${richText(R)}</li>`);
    h+=`</ul></div></div>`;
    if(showKey) h+=`<div class="match-key">Klucz: ${esc((t.left||[]).map((Lx,li)=>`${li+1}–${Lx.correct||'?'}`).join(', '))}</div>`;
  }
  if(t.type==='math_open'){ h+=`<div class="workbox grid" style="min-height:${t.heightmm||200}mm"></div>`; }
  else if(t.type==='essay'){ h+=writeLines(t.lines||16); }
  else if(['open','gaps','source','image'].includes(t.type)){ h+=writeLines(t.lines||4); }
  return h;
}

function renderSheet(showKey){
  const m=state.meta, sheet=document.getElementById('sheet'), max=totalPoints();
  sheet.className='sheet mode-'+m.mode;
  let h='';

  if(m.mode==='exam'){
    h+=`<div class="exam-top">
          <div class="brand">
            <svg width="20" height="20" viewBox="0 0 100 100"><polygon points="50,22 90,42 50,62 10,42" fill="currentColor"/></svg>
            ARKUSZ EGZAMINACYJNY
          </div>
          <div style="max-width:52%; text-align:right">Arkusz zawiera informacje prawnie chronione do momentu rozpoczęcia egzaminu.</div>
        </div>`;
    h+=`<div class="exam-fill"><div class="bar">Wypełnia zdający</div>
          <div class="codes">
            <div class="grp">KOD ${cells(7)}</div>
            <div class="grp">PESEL ${cells(11)}</div>
          </div></div>`;
    h+=`<div class="exam-band"><span class="wt">${esc(m.workType)}</span>${m.formula?`<span class="fm">${esc(m.formula)}</span>`:''}</div>`;
    h+=`<div class="exam-title"><div class="subj">${esc((m.subject||'').toUpperCase())}</div>${m.level?`<span class="lvl">${esc(m.level)}</span>`:''}</div>`;
    if(m.topic) h+=`<div class="exam-topic"><span class="lab">Temat:</span>${esc(m.topic)}</div>`;
    h+=`<div class="exam-meta">
          ${m.date?`DATA: <b>${esc(m.date)}</b><br>`:''}
          ${m.duration?`CZAS TRWANIA: <b>${esc(m.duration)} minut</b><br>`:''}
          LICZBA PUNKTÓW DO UZYSKANIA: <b>${max}</b>
        </div>`;
    if(m.instruction) h+=`<div class="instruction"><div class="ih">Instrukcja dla zdającego</div>${richText(m.instruction)}</div>`;
    h+=`<hr class="sheet-rule">`;
  } else {
    h+=`<div class="test-head">
          <div class="eyebrow">${esc(m.workType)} · ${esc(m.subject)}</div>
          <h1>${esc(m.topic||'Temat pracy')}</h1>
          ${m.subtitle?`<div class="sub">${esc(m.subtitle)}</div>`:''}
        </div>`;
    h+=`<div class="test-identity">
          <div class="fld"><span class="lb">Imię i nazwisko:</span><span class="ln" style="min-width:150px"></span></div>
          ${m.klasa?`<div class="fld"><span class="lb">Klasa:</span><span class="ln">${esc(m.klasa)}</span></div>`:`<div class="fld"><span class="lb">Klasa:</span><span class="ln"></span></div>`}
          <div class="fld"><span class="lb">Data:</span><span class="ln"></span></div>
          <div class="fld"><span class="lb">Wynik:</span><span class="ln" style="min-width:36px"></span> / ${max}</div>
          <div class="fld"><span class="lb">Ocena:</span><span class="ln" style="min-width:60px"></span></div>
        </div>`;
    if(m.instruction) h+=`<div class="instruction">${richText(m.instruction)}</div>`;
  }

  state.tasks.forEach((t,i)=>{
    const info=TYPES[t.type];
    const pmax=parseInt(t.points)||0;
    const icon=`<span class="t-ic" title="${esc(info.label)}">${esc(info.icon)}</span>`;
    const fp=(t.type==='math_open' && t.fullpage)?' fullpage':'';
    if(m.mode==='test'){
      const pts=`<span class="t-pts"><span class="blank"></span> / ${pmax} pkt</span>`;
      const head=`<div class="t-head">${t.title?`<span class="t-title">${esc(t.title)}</span>`:''}${icon}${pts}</div>`;
      h+=`<div class="task${fp}"><div class="t-no">${i+1}</div><div class="t-main">${head}${taskBody(t,showKey)}</div></div>`;
    } else {
      const pts=`<span class="t-pts">(0–${pmax})</span>`;
      const head=`<div class="t-head"><span class="zno">Zadanie ${i+1}.</span>${t.title?`<span class="t-title">${esc(t.title)}</span>`:''}${icon}${pts}</div>`;
      h+=`<div class="task${fp}"><div class="t-main">${head}${taskBody(t,showKey)}</div></div>`;
    }
  });

  if(m.brudnopis) h+=`<div class="brudnopis fullpage"><div class="bl">BRUDNOPIS</div><div style="min-height:120mm"></div></div>`;
  h+=`<div class="sheet-foot">Przygotowano w Kreatorze prac pisemnych GAMIK · ${state.tasks.length} zad. · ${max} pkt</div>`;

  sheet.innerHTML=h;
  if(window.MathJax && MathJax.typesetPromise){ MathJax.typesetClear&&MathJax.typesetClear([sheet]); MathJax.typesetPromise([sheet]).catch(()=>{}); }
}

/* ===== tryby ===== */
function showPreview(){ document.body.classList.add('previewing'); document.getElementById('btn-edit').style.display=''; document.getElementById('btn-preview').style.display='none'; renderSheet(document.getElementById('chk-key').checked); window.scrollTo(0,0); }
function showEditor(){ document.body.classList.remove('previewing'); document.getElementById('btn-edit').style.display='none'; document.getElementById('btn-preview').style.display=''; }
document.getElementById('btn-preview').onclick=showPreview;
document.getElementById('btn-edit').onclick=showEditor;
document.getElementById('chk-key').onchange=()=> renderSheet(document.getElementById('chk-key').checked);
document.getElementById('btn-print').onclick=()=>{ if(!state.tasks.length){ alert('Dodaj przynajmniej jedno zadanie.'); return; } showPreview(); setTimeout(()=>window.print(),350); };

/* ===== zapis / wczytanie ===== */
document.getElementById('btn-save').onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  const name=(state.meta.topic||state.meta.workType||'praca').replace(/[^a-z0-9ąćęłńóśźż _-]/gi,'').trim()||'praca';
  a.href=URL.createObjectURL(blob); a.download=name+'.gamik.json'; a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('btn-load').onclick=()=> document.getElementById('file-load').click();
document.getElementById('file-load').onchange=e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{
    const obj=JSON.parse(r.result); if(!obj.meta||!Array.isArray(obj.tasks)) throw new Error('Zły format');
    // normalizacja starszych plików
    if(!obj.meta.mode) obj.meta.mode='test';
    if(!obj.meta.instruction) obj.meta.instruction=DEF_INSTR;
    obj.tasks.forEach(t=>{ if(t.type==='math') t.type='math_open'; if(t.title===undefined) t.title=''; });
    state=obj; renderSettings(); renderTasks(); showEditor();
  }catch(err){ alert('Nie udało się wczytać pliku: '+err.message); } };
  r.readAsText(f); e.target.value='';
};

/* ===== boot ===== */
initMeta(); renderSettings(); renderTasks();
